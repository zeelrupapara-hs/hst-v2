<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orders</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-toolbar"><button type="button" class="tb-btn" data-reload>↻ Reload</button></div>
  <p class="module-note">Orders belong to a trading account (<strong>login</strong>). Click login to open the account with its full trade history.</p>
  <div class="filter-bar"><label>Search</label><input type="search" data-search placeholder="Symbol…"></div>
  <div class="module-content table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>Order</th><th>Login</th><th>Symbol</th><th>Type</th><th>State</th><th>Volume</th><th>Price</th><th>Setup</th></tr>
      </thead>
      <tbody data-tbody></tbody>
    </table>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.bootList({
      title: "Orders",
      menu: "manager.orders",
      endpoint: "/api/v1/orders",
      query: { limit: "500" },
      idKey: "order_id",
      configPage: "../admin/orders-detail.html?id=",
      columns: [
        { key: "order_id" },
        { key: "login", html: true, render: function (r) {
          return '<a href="users-detail.html?login=' + r.login + '">' + r.login + "</a>";
        }},
        { key: "symbol" }, { key: "type" }, { key: "state" }, { key: "volume" }, { key: "price_order" },
        { key: "time_setup", render: function (r) { return HSTModule.fmtTs(r.time_setup); } }
      ]
    });
  </script>
</body>
</html>
