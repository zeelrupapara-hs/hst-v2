<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Balance Operations</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-detail-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-content">
    <div class="config-window">
      <div class="config-title">Balance operation</div>
      <div class="config-body">
        <div class="form-grid">
          <label for="login">Login</label><input id="login" type="number" value="10001">
          <label for="op">Operation</label>
          <select id="op">
            <option value="deposit">Deposit</option>
            <option value="withdrawal">Withdrawal</option>
            <option value="credit">Credit</option>
            <option value="correction">Correction</option>
          </select>
          <label for="amount">Amount</label><input id="amount" type="text" value="1000.00">
          <label for="comment">Comment</label><input id="comment" type="text" value="Manual operation">
        </div>
      </div>
      <div class="config-actions">
        <button type="button" id="btnExec">Execute</button>
        <button type="button" id="btnClear">Clear</button>
      </div>
      <pre class="detail-json" id="result"></pre>
    </div>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.setApiBar(document.querySelector("[data-detail-module]"), { demo: true, message: "Demo mode — balance form preview" });
    document.getElementById("btnExec").addEventListener("click", async function () {
      if (HSTModule.useDemo()) {
        document.getElementById("result").textContent = JSON.stringify({
          ok: true,
          demo: true,
          message: "Demo: " + document.getElementById("op").value + " executed",
          login: Number(document.getElementById("login").value),
          amount: parseFloat(document.getElementById("amount").value),
          comment: document.getElementById("comment").value
        }, null, 2);
        HSTModule.setApiBar(document.querySelector("[data-detail-module]"), { demo: true, message: "Demo operation recorded" });
        return;
      }
      var op = document.getElementById("op").value;
      var body = {
        login: Number(document.getElementById("login").value),
        amount: parseFloat(document.getElementById("amount").value),
        comment: document.getElementById("comment").value
      };
      var res = await HSTApi.post("/api/v1/balance/" + op, body);
      document.getElementById("result").textContent = JSON.stringify(res.envelope || res, null, 2);
      HSTModule.setApiBar(document.querySelector("[data-detail-module]"), {
        message: res.ok ? op + " OK — " + res.elapsed + " ms" : "HTTP " + res.status
      });
    });
    document.getElementById("btnClear").addEventListener("click", function () {
      document.getElementById("result").textContent = "";
    });
  </script>
</body>
</html>
