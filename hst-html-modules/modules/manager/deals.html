<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deals</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-toolbar"><button type="button" class="tb-btn" data-reload>↻ Reload</button></div>
  <p class="module-note"><strong>Deals</strong> = executed trade legs (immutable history). Linked to order and position on the same login.</p>
  <div class="module-content table-wrap">
    <table class="data-table">
      <thead>
        <tr><th>Deal</th><th>Login</th><th>Order</th><th>Symbol</th><th>Action</th><th>Volume</th><th>Price</th><th>Profit</th><th>Time</th></tr>
      </thead>
      <tbody data-tbody></tbody>
    </table>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/icons.js"></script>
  <script src="../../assets/js/trade-ui.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.bootList({
      title: "Deals",
      menu: "manager.deals",
      endpoint: "/api/v1/deals",
      query: { limit: "500" },
      idKey: "deal_id",
      configPage: "../admin/deals-detail.html?id=",
      columns: [
        { key: "deal_id" },
        { key: "login", html: true, render: function (r) {
          return '<a href="users-detail.html?login=' + r.login + '">' + r.login + "</a>";
        }},
        { key: "order_id" }, { key: "symbol" }, { key: "action" }, { key: "volume" }, { key: "price" }, { key: "profit" },
        { key: "time", render: function (r) { return HSTModule.fmtTs(r.time); } }
      ]
    });
  </script>
</body>
</html>
