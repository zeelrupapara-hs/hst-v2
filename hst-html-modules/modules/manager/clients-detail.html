<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-config-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-toolbar">
    <button type="button" class="tb-btn" onclick="history.back()">← Back</button>
    <button type="button" class="tb-btn" data-reload>↻ Reload</button>
  </div>
  <p class="module-note">Flow: <strong>Group</strong> → <strong>Client</strong> (CRM profile) → <strong>Trading Account</strong> (login) → Orders / Positions / Deals</p>
  <div class="module-content">
    <div class="config-window full">
      <div class="config-title">Client #<span data-field="client_id">…</span> — <span data-field="person_name">…</span> <span data-field="person_last_name"></span></div>
      <div class="config-tabs">
        <button type="button" class="active" data-config-tab="profile">Profile</button>
        <button type="button" data-config-tab="accounts">Trading Accounts</button>
        <button type="button" data-config-tab="summary">Summary</button>
      </div>
      <div class="config-body">
        <div class="config-panel active" data-config-panel="profile">
          <fieldset class="fieldset"><legend>Person</legend>
            <div class="form-grid">
              <label>Client ID</label><input data-field="client_id" readonly>
              <label>First name</label><input data-field="person_name" readonly>
              <label>Last name</label><input data-field="person_last_name" readonly>
              <label>Email</label><input data-field="contact_email" readonly>
              <label>Phone</label><input data-field="contact_phone" readonly>
              <label>Country</label><input data-field="address_country" readonly>
              <label>City</label><input data-field="address_city" readonly>
              <label>Status</label><input data-field="client_status" readonly>
              <label>KYC</label><input data-field="kyc_status" readonly>
              <label>Assigned manager</label><input data-field="assigned_manager" readonly>
              <label>Comment</label><input data-field="comment" readonly>
            </div>
          </fieldset>
        </div>
        <div class="config-panel" data-config-panel="accounts">
          <p class="module-note">One client may hold multiple trading accounts (logins), each in a <strong>group</strong>. Double-click a login to open the account.</p>
          <table class="data-table">
            <thead><tr><th>Login</th><th>Group</th><th>Name</th><th>Balance</th><th>Leverage</th><th>Last access</th></tr></thead>
            <tbody id="accountsBody"></tbody>
          </table>
        </div>
        <div class="config-panel" data-config-panel="summary">
          <div class="form-grid">
            <label>Trading accounts</label><input id="sumAccounts" readonly>
            <label>Total balance</label><input id="sumBalance" readonly>
            <label>Open positions</label><input id="sumPositions" readonly>
            <label>Active orders</label><input id="sumOrders" readonly>
            <label>Deals (history)</label><input id="sumDeals" readonly>
          </div>
        </div>
      </div>
      <div class="config-actions"><button type="button" onclick="history.back()">Close</button></div>
    </div>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.bootConfig({
      title: "Client",
      endpoint: "/api/v1/clients",
      getId: function () { return new URLSearchParams(location.search).get("id"); },
      fillForm: async function (data, root, clientId) {
        data.client_status = HSTModule.fmtClientStatus(data.client_status);
        data.kyc_status = HSTModule.fmtKycStatus(data.kyc_status);
        HSTModule.fillFields(root, data);
        var accounts = HSTModule.useDemo()
          ? HSTMock.accountsForClient(clientId)
          : (await HSTApi.get("/api/v1/users?client_id=" + clientId)).data || [];
        HSTModule.renderTable(document.getElementById("accountsBody"), accounts, [
          { key: "login", html: true, render: function (r) { return '<a href="users-detail.html?login=' + r.login + '">' + r.login + "</a>"; } },
          { key: "group" }, { key: "name" }, { key: "balance" }, { key: "leverage" },
          { key: "last_access", render: function (r) { return HSTModule.fmtTs(r.last_access); } }
        ], {
          rowAttrs: function (tr) {
            tr.addEventListener("dblclick", function () {
              var login = tr.querySelector("a");
              if (login) location.href = "users-detail.html?login=" + login.textContent;
            });
          }
        });
        var totalBal = 0, pos = 0, ord = 0, dls = 0;
        accounts.forEach(function (a) {
          totalBal += a.balance || 0;
          if (HSTMock) {
            pos += HSTMock.positionsForLogin(a.login).length;
            ord += HSTMock.ordersForLogin(a.login).length;
            dls += HSTMock.dealsForLogin(a.login).length;
          }
        });
        document.getElementById("sumAccounts").value = accounts.length;
        document.getElementById("sumBalance").value = totalBal.toFixed(2);
        document.getElementById("sumPositions").value = pos;
        document.getElementById("sumOrders").value = ord;
        document.getElementById("sumDeals").value = dls;
      }
    });
    document.querySelector("[data-reload]").addEventListener("click", function () { location.reload(); });
  </script>
</body>
</html>
