<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Routing</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-toolbar">
    <button type="button" class="tb-btn" data-reload>↻ Reload</button>
    <button type="button" class="tb-btn" data-edit>✎ Rule Settings…</button>
  </div>
  <div class="filter-bar">
    <label>Search</label>
    <input type="search" data-search placeholder="Rule name…">
  </div>
  <div class="module-content table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Mode</th>
          <th>Action</th>
          <th>Index</th>
          <th>Modified</th>
        </tr>
      </thead>
      <tbody data-tbody></tbody>
    </table>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.bootList({
      title: "Routing",
      menu: "admin.routing",
      endpoint: "/api/v1/routing",
      query: { limit: "500" },
      idKey: "routing_id",
      configPage: "routing-config.html?id=",
      columns: [
        { key: "routing_id" },
        { key: "name" },
        { key: "mode" },
        { key: "action" },
        { key: "routing_index" },
        { key: "date_modified", render: function (r) { return HSTModule.fmtTs(r.date_modified); } }
      ]
    });
  </script>
</body>
</html>
