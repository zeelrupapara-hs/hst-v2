<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Symbols</title>
  <script>
    (function () {
      var target = "/admin/symbols";
      try {
        if (window.top !== window.self) {
          window.top.location.href = target;
        } else {
          window.location.replace(target);
        }
      } catch (e) {
        window.location.replace(target);
      }
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/admin/symbols">Symbols</a>…</p>
</body>
</html>
