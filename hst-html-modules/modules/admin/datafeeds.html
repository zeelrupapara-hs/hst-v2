<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Feeds</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-toolbar"><button type="button" class="tb-btn" data-reload>↻ Reload</button></div>
  <div class="filter-bar"><label>Search</label><input type="search" data-search placeholder="Name, module…"></div>
  <div class="module-content table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Module</th><th>Enable</th><th>Feed server</th>
          <th>Gateway</th><th>Ticks</th><th>Updated</th>
        </tr>
      </thead>
      <tbody data-tbody></tbody>
    </table>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.bootList({
      title: "Data feeds",
      menu: "admin.datafeeds",
      endpoint: "/api/v1/datafeeds",
      query: { limit: "500" },
      idKey: "datafeed_id",
      columns: [
        { key: "datafeed_id" }, { key: "name" }, { key: "module" }, { key: "enable" },
        { key: "feed_server" }, { key: "gateway_server" }, { key: "ticks_count" },
        { key: "updated_at", render: function (r) { return HSTModule.fmtTs(r.updated_at); } }
      ]
    });
  </script>
</body>
</html>
