<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orders</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-toolbar">
    <button type="button" class="tb-btn" data-reload>↻ Request</button>
    <button type="button" class="tb-btn" data-edit>✎ Edit</button>
  </div>
  <div class="trade-request-bar">
    <label>Request</label>
    <select data-req-mode><option>By groups</option><option>By logins</option><option>By tickets</option></select>
    <input type="text" data-req-target placeholder="Group, login or #ticket…" value="*">
    <label>Symbol</label>
    <input type="text" placeholder="All symbols" style="width:100px">
    <label><input type="checkbox" data-req-open> Open only</label>
    <select data-req-period><option>Today</option><option>Last 3 days</option><option>Last week</option><option>All history</option></select>
    <input type="datetime-local" data-req-from>
    <span>—</span>
    <input type="datetime-local" data-req-to>
    <label>Database</label>
    <select><option>Current database</option></select>
  </div>
  <div class="filter-bar"><label>Search</label><input type="search" data-search placeholder="Symbol, login…"></div>
  <p class="module-note">Double-click an order for Details, Visualization, Ticks and Journal tabs (<em>admin_orders.htm#view</em>).</p>
  <div class="module-content table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th></th><th>Time</th><th>Order</th><th>Login</th><th>Symbol</th><th>Type</th><th>State</th>
          <th>Volume</th><th>Price</th><th>SL</th><th>TP</th><th>Reason</th><th>Comment</th>
        </tr>
      </thead>
      <tbody data-tbody></tbody>
    </table>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/icons.js"></script>
  <script src="../../assets/js/trade-ui.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.bootList({
      title: "Orders",
      menu: "admin.orders",
      endpoint: "/api/v1/orders",
      query: { limit: "500", active: "false" },
      idKey: "order_id",
      configPage: "orders-detail.html?id=",
      columns: [
        { key: "icon", html: true, render: function (r) { return HSTTradeUI.actionIcon(r.type === 0 ? 0 : 1); } },
        { key: "time_setup", render: function (r) { return HSTTradeUI.fmtTs(r.time_setup, r.time_setup_ms); } },
        { key: "order_id" }, { key: "login" }, { key: "symbol" },
        { key: "type", render: function (r) { return HSTTradeUI.labelOrderType(r.type); } },
        { key: "state", render: function (r) { return HSTTradeUI.labelOrderState(r.state); } },
        { key: "volume", render: function (r) {
          return r.volume_initial != null ? HSTTradeUI.fmtVol(r.volume) + " / " + HSTTradeUI.fmtVol(r.volume_initial) : HSTTradeUI.fmtVol(r.volume);
        }},
        { key: "price_order" }, { key: "price_sl" }, { key: "price_tp" },
        { key: "reason", render: function (r) { return HSTTradeUI.labelReason(r.reason); } },
        { key: "comment", render: function (r) { return r.comment || "—"; } }
      ]
    });
  </script>
</body>
</html>
