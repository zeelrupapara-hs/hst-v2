<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trading Accounts</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-toolbar">
    <button type="button" class="tb-btn" data-reload>↻ Reload</button>
    <button type="button" class="tb-btn" data-edit>✎ Account details…</button>
  </div>
  <p class="module-note"><strong>Trading account</strong> (login) → assigned to <strong>group</strong> + linked to <strong>client</strong>. Double-click for positions, orders &amp; deals.</p>
  <div class="filter-bar"><label>Search</label><input type="search" data-search placeholder="Login, name, email…"></div>
  <div class="module-content table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Login</th><th>Client</th><th>Group</th><th>Name</th><th>Email</th>
          <th>Leverage</th><th>Balance</th><th>Credit</th><th>Last access</th>
        </tr>
      </thead>
      <tbody data-tbody></tbody>
    </table>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.bootList({
      title: "Trading accounts",
      menu: "admin.users",
      endpoint: "/api/v1/users",
      query: { limit: "500" },
      idKey: "login",
      configPage: "users-detail.html?login=",
      columns: [
        { key: "login" },
        { key: "client_id", html: true, render: function (r) {
          return '<a href="clients-detail.html?id=' + r.client_id + '">' + r.client_id + "</a>";
        }},
        { key: "group" }, { key: "name" }, { key: "email" },
        { key: "leverage" }, { key: "balance" }, { key: "credit" },
        { key: "last_access", render: function (r) { return HSTModule.fmtTs(r.last_access); } }
      ]
    });
  </script>
</body>
</html>
