<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Symbol Settings</title>
  <link rel="stylesheet" href="../../assets/css/terminal.css">
</head>
<body class="module-root" data-config-module>
  <div class="api-bar" data-api-bar><span class="api-dot" data-api-dot></span><span data-api-msg>…</span></div>
  <div class="module-toolbar">
    <button type="button" class="tb-btn" onclick="history.back()">← Back</button>
    <button type="button" class="tb-btn" data-reload>↻ Reload</button>
  </div>
  <div class="module-content">
    <div class="config-window full sym-config-window">
      <div class="config-title">Symbol: <span data-field="symbol">…</span></div>
      <div class="config-tabs">
        <button type="button" class="active" data-config-tab="common">Common</button>
        <button type="button" data-config-tab="trade">Trade</button>
        <button type="button" data-config-tab="calc">Calculation</button>
        <button type="button" data-config-tab="sessions">Sessions</button>
      </div>
      <div class="config-body">
        <div class="config-panel active" data-config-panel="common">
          <div class="form-grid">
            <label>Symbol</label><input data-field="symbol" readonly>
            <label>Path</label><input data-field="path" readonly>
            <label>Description</label><input data-field="description" readonly>
            <label>Digits</label><input data-field="digits" readonly>
            <label>Spread</label><input data-field="spread" readonly>
            <label>Modified</label><input data-field="date_modified" readonly>
          </div>
        </div>
        <div class="config-panel" data-config-panel="trade">
          <div class="form-grid">
            <label>Trade mode</label><input data-field="trade_mode" readonly>
            <label>Execution</label><input data-field="exec_mode" readonly>
            <label>Contract size</label><input data-field="contract_size" readonly>
          </div>
        </div>
        <div class="config-panel" data-config-panel="calc">
          <div class="form-grid">
            <label>Calculation mode</label><input data-field="calc_mode" readonly>
          </div>
        </div>
        <div class="config-panel" data-config-panel="sessions"></div>
      </div>
      <div class="config-actions">
        <button type="button" onclick="history.back()">Close</button>
      </div>
    </div>
  </div>
  <script src="../../assets/js/mock-data.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/context-menu.js"></script>
  <script src="../../assets/js/context-menus.js"></script>
  <script src="../../assets/js/symbols-ui.js"></script>
  <script src="../../assets/js/module.js"></script>
  <script>
    HSTModule.bootConfig({
      title: "Symbol",
      endpoint: "/api/v1/symbols",
      getId: function () { return new URLSearchParams(location.search).get("id"); },
      fillForm: function (data, root) {
        data.exec_mode = HSTModule.fmtExecMode(data.exec_mode);
        data.date_modified = HSTModule.fmtTs(data.date_modified);
        HSTModule.fillFields(root, data);
        HSTSymbolsUI.renderSessionsPanel(root, data);
      }
    });
  </script>
</body>
</html>
