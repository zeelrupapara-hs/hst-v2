<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HST — API Connection</title>
  <link rel="stylesheet" href="assets/css/terminal.css?v=mt5">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #eef1f5; }
    .card { width: 420px; padding: 24px; background: #fff; border: 1px solid #aca899; }
    .card h1 { margin: 0 0 8px; font-size: 16px; color: #0039a6; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 11px; }
    .field input, .field select { width: 100%; height: 26px; border: 1px solid #aca899; padding: 0 8px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button, .actions a.btn { flex: 1; height: 28px; border: 1px solid #aca899; background: linear-gradient(#fff,#ece9d8); text-align: center; line-height: 26px; text-decoration: none; color: #000; font-size: 11px; }
    .actions button.primary { background: linear-gradient(#4a90d9,#2b5797); color: #fff; border-color: #1e4070; }
    .msg { margin-top: 12px; padding: 8px; font-size: 11px; display: none; }
    .msg.ok { display: block; background: #c8e6c9; }
    .msg.err { display: block; background: #ffcdd2; }
  </style>
  <script src="assets/js/api.js"></script>
</head>
<body>
  <div class="card">
    <h1>Connect to HST API</h1>
    <p style="font-size:11px;color:#666;margin:0 0 16px">Sign in once — modules load live data from your backend.</p>

    <div class="field">
      <label for="apiBase">API base URL</label>
      <input id="apiBase" type="url" value="http://localhost:8080">
    </div>
    <div class="field">
      <label for="login">Login</label>
      <input id="login" type="text" value="1000">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" value="Bootstrap-Admin-2026!">
    </div>
    <div class="field">
      <label for="connectionType">Panel</label>
      <select id="connectionType">
        <option value="32">Administrator (32)</option>
        <option value="33" selected>Manager (33)</option>
      </select>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="btnLogin">Sign in</button>
      <a class="btn" href="index.html">Back</a>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    document.getElementById("apiBase").value = HSTApi.getApiBase();
    document.getElementById("btnLogin").addEventListener("click", async function () {
      var msg = document.getElementById("msg");
      HSTApi.setApiBase(document.getElementById("apiBase").value.trim());
      var result = await HSTApi.login(
        document.getElementById("login").value.trim(),
        document.getElementById("password").value,
        document.getElementById("connectionType").value
      );
      msg.className = "msg " + (result.ok ? "ok" : "err");
      msg.textContent = result.ok
        ? "Connected as login " + result.data.data.login + ". Open admin or manager panel."
        : "Failed (" + result.status + "): " + JSON.stringify(result.data);
    });
  </script>
</body>
</html>
