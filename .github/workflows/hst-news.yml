name: hst-news

on:
  push:
    branches: [main]
    paths: ["hst-news/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: hst-news
          push: true
          tags: |
            ghcr.io/zeelrupapara-hs/hst-newsype=gha,scope=hst-news
          cache-to: type=gha,scope=hst-news,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/hst
            docker compose -f compose.staging.yml pull hst-news
            docker compose -f compose.staging.yml up -d hst-news
            docker image prune -f
