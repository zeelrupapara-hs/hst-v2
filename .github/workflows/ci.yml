name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: hst-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: hst-server/go.mod

      - name: Install the project tools
        run: make tools

      - name: Quality and security gate
        run: make check
