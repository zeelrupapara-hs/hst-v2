name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # one red module should not hide the state of the other
      fail-fast: false
      matrix:
        module: [hst-server, hst-core]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      - name: Install the project tools
        run: make tools

      - name: Quality and security gate
        run: make check
