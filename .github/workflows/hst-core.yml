name: hst-core

on:
  push:
    branches: [main]
    paths: ["hst-core/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: hst-core
          push: true
          tags: |
            ghcr.io/zeelrupapara-hs/hst-core:staging
            ghcr.io/zeelrupapara-hs/hst-core:sha-${{ github.sha }}
          cache-from: type=gha,scope=hst-core
          cache-to: type=gha,scope=hst-core,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/hst
            docker compose -f compose.staging.yml pull hst-core
            docker compose -f compose.staging.yml up -d hst-core
            docker image prune -f
