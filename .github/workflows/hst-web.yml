name: hst-web

on:
  push:
    branches: [main]
    paths: ["hst-web/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: hst-web
          push: true
          build-args: |
            VITE_BASE_URL=http://168.144.127.209:8080
            VITE_SOCKET_URL=ws://168.144.127.209:8080/ws
          tags: |
            ghcr.io/zeelrupapara-hs/hst-web:staging
            ghcr.io/zeelrupapara-hs/hst-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=hst-web
          cache-to: type=gha,scope=hst-web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/hst
            docker compose -f compose.staging.yml pull hst-trader-web
            docker compose -f compose.staging.yml up -d hst-trader-web
            docker image prune -f
