    - paragraph [ref=f15e31]: Execution
    - paragraph [ref=f15e32]:
      - img "Execution" [ref=f15e33]
    - paragraph [ref=f15e34]: Execution parameters of orders of a financial instrument or group of instruments specified on the previous tab, are set up here.
    - paragraph [ref=f15e35]:
      - generic [ref=f15e36]:
        - text: If you enable "Use default execution settings", execution settings for these symbols (or group of symbols) will be taken from their settings in the
        - link "corresponding section" [ref=f15e37] [cursor=pointer]:
          - /url: symbol_settings_execution.htm
        - text: .
      - text: All the below parameters will become inactive.
    - paragraph [ref=f15e38]: Instant
    - paragraph [ref=f15e39]: "In this mode a client places an order at prices from the Market Watch window without requesting prices before that. The following settings are available for this mode:"
    - paragraph [ref=f15e40]:
      - generic [ref=f15e41]: •
      - text: Max time deviation — the maximal difference between the time when the price specified in the client's order was received, and the time of the latest price. If this limit is exceeded, requote is performed and new prices are sent to the client;
    - paragraph [ref=f15e42]:
      - generic [ref=f15e43]: •
      - text: Max profit deviation — maximal deviation of the order price from the current symbol price in the direction profitable for a client. This value being exceeded, new prices will be sent to the client;
    - paragraph [ref=f15e44]:
      - generic [ref=f15e45]: •
      - text: Max losing deviation — maximal deviation of the order price from the current symbol price in the direction losing for a client. This value being exceeded, new prices will be sent to the client;
    - paragraph [ref=f15e46]:
      - generic [ref=f15e47]: •
      - text: Maximum volume — the maximum volume of the order that can be accepted in the instant execution mode. All clients' orders larger than that will be automatically transferred to the manual execution mode.
    - paragraph [ref=f15e48]: The following options are used only if the deal volume exceeds the maximum volume that can be accepted in the instant execution mode. Such deals are processed in the "Request" execution mode.
    - paragraph [ref=f15e49]:
      - generic [ref=f15e50]: •
      - text: Timeout — time in seconds, during which the price provided by the dealer is valid;
    - paragraph [ref=f15e51]:
      - generic [ref=f15e52]: •
      - text: Confirm orders — if this option is enabled, then after a trader received quotes from a dealer and agrees to execute a deal at them, the dealer will have to additionally confirm the execution of this order.
    - table [ref=f15e54]:
