    - paragraph [ref=f15e61]: Request
    - paragraph [ref=f15e62]: "In this mode, a client requests the filling price before placing an order. The following options are available here:"
    - paragraph [ref=f15e63]:
      - generic [ref=f15e64]: •
      - text: Timeout — time in seconds, during which the price provided by the dealer is valid;
    - paragraph [ref=f15e65]:
      - generic [ref=f15e66]: •
      - text: Confirm orders — if this option is enabled, then after a trader received quotes from a dealer and agrees to execute a deal at them, the dealer will have to additionally confirm the execution of this order.
    - paragraph [ref=f15e67]: Market
    - paragraph [ref=f15e68]: In this mode, a client places an order at the broker's price, "agreeing with it in advance".
    - paragraph [ref=f15e69]: Exchange
    - paragraph [ref=f15e70]: In this execution mode a trader's request is passed to an external gateway connected to an exchange or another liquidity provider.
