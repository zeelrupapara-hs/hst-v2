    - paragraph [ref=f11e450]: Visualization
    - paragraph [ref=f11e451]: In this section, execution of a trading operation is visualized on the tick chart of the appropriate symbol.
    - paragraph [ref=f11e452]:
      - img "Trading visualization" [ref=f11e453]
    - paragraph [ref=f11e454]: Nearest ticks before and after the operation
    - paragraph [ref=f11e455]: When examining disputable situations with traders, it is often necessary to analyze quotes which were broadcasted at the trading operation execution time. The relevant quote data can be obtained in a couple of clicks. Open operation details and navigate to the "Ticks" section. The terminal will automatically request the quote history from the server for the entire day on which the operation was performed. The nearest quote to operation execution time will be automatically selected in the list of received quotes.
    - paragraph [ref=f11e456]:
      - img "Nearest ticks before and after the operation" [ref=f11e457]
    - paragraph [ref=f11e458]: Operation journal
    - paragraph [ref=f11e459]:
      - generic [ref=f11e460]:
        - text: This is another tool to assist during the follow-up operation examination. There is no need to manually request
        - link "logs from the server" [ref=f11e461] [cursor=pointer]:
          - /url: network_journal.htm
        - text: and to filter its records. Open operation details, navigate to the "Journal" section and the terminal will automatically request the necessary logs from the server, using ticket and time interval filters (from the operation date to the current day).
    - paragraph [ref=f11e462]:
      - img "Operation journal" [ref=f11e463]
    - paragraph [ref=f11e464]: Trading operation report
    - paragraph [ref=f11e465]: The trading operation details available in the editing dialogs can be saved as a report. The report contains the entire chain of operations from an order to a position, visualization on a tick chart, extract from the server log and the trading account overall status.
    - paragraph [ref=f11e466]:
      - generic [ref=f11e467]:
        - text: To generate a file, click "Report" in the context menu in the "
        - link "Overview and related operations" [ref=f11e468] [cursor=pointer]:
          - /url: admin_deals.htm#connected_transactions
        - text: "\" section. Next, select data to be saved: account state, trading totals, logs, tick chart, etc."
    - paragraph [ref=f11e469]:
      - img "Trading operation report" [ref=f11e470]
    - paragraph [ref=f11e471]: Select the path on the disk and click "Save".
