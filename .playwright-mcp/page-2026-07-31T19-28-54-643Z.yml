    - paragraph [ref=f11e314]:
      - generic [ref=f11e315]: •
      - text: Margin rate — exchange rate of the margin currency to the trader's deposit currency. The value depends on the deal direction. For buy deals, it is the rate of margin currency selling for the deposit currency; for Buy deals it is the rate of currency margin buying for the deposit currency.
    - paragraph [ref=f11e316]:
      - generic [ref=f11e317]: •
      - text: Market Bid — the market Bid price as at the time of deal execution by the server. The field is only filled for the deals which were created after the platform was updated to build 2890 or higher. For earlier deals, the value will be zero.
    - paragraph [ref=f11e318]:
      - generic [ref=f11e319]: •
      - text: Market Ask — the market Ask price as at the time of deal execution by the server. The field is only filled for the deals which were created after the platform was updated to build 2890 or higher. For earlier deals, the value will be zero.
    - paragraph [ref=f11e320]:
      - generic [ref=f11e321]: •
      - text: Market Last — the market Last price as at the time of deal execution by the server. The field is only filled for the deals which were created after the platform was updated to build 2890 or higher. For earlier deals, the value will be zero.
