    - paragraph [ref=f11e325]: Gateway price, volume, and action
    - paragraph [ref=f11e326]: A set of the fields – "Gateway price" and "Gateway" (direction and volume) – provides a clear and unambiguous description of how a deal is routed to an external system. Using these fields, you can implement various coverage strategies, including full, partial, and opposite.
    - paragraph [ref=f11e327]: "The positions that are opened or modified as a result of external deal execution inherit the relevant properties. In the case of a position modification, the values are applied to the existing position. For example, a Buy 1.00 EURUSD at 1.12060 deal was opened in the platform. In the external system, the deal was covered by 30%:"
