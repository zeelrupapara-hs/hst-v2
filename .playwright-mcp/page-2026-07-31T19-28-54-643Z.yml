    - table [ref=f11e296]:
      - rowgroup [ref=f11e297]:
        - row [ref=f11e298]:
          - cell "• Deals that close positions fully or partially inherit their modification flags. After closing, no separate entry about the position remains in the database. In order not to lose data on modifications, the flags are copied to the deal closing the position. In this case, the additional Position modification flag is added to the deal meaning that the flags were inherited from the position. When inheriting, the deal modification flags are not lost. Instead, they are added to the position flags. • The deals changed by an administrator or manager, as well as restored deals are highlighted in the list in red. • Use Trade Modification Report to obtain information about all modified trade operations." [ref=f11e299]:
