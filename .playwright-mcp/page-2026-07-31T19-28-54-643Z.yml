  - generic [ref=f11e28]:
    - paragraph [ref=f11e29]: Deals
    - paragraph [ref=f11e30]: This section allows working with the entire history of deals executed by traders' orders, and balance operations.
    - paragraph [ref=f11e31]:
      - img "Deals" [ref=f11e32]
    - paragraph [ref=f11e33]:
      - generic [ref=f11e34]:
        - text: Depending on points selected in the
        - link "context menu" [ref=f11e35] [cursor=pointer]:
          - /url: admin_deals.htm#context
        - text: ", various"
        - link "information about deals" [ref=f11e36] [cursor=pointer]:
          - /url: admin_deals.htm#view
        - text: is shown here. Deals can be sorted out by any field by a left button click on the field name.
    - paragraph [ref=f11e37]: Requesting Deals
    - paragraph [ref=f11e38]: "In order to view deals, a request should be constructed. A request can be performed:"
    - paragraph [ref=f11e39]:
      - generic [ref=f11e40]: •
      - text: By groups To do it, select a group from the dropdown list.
    - paragraph [ref=f11e41]:
      - generic [ref=f11e42]: •
      - text: By logins Specify one or several account numbers separated by commas.
    - paragraph [ref=f11e43]:
      - generic [ref=f11e44]: •
      - text: "By tickets To request deals by their number, specify one or several tickets separated by commas. Before deal tickets the # symbol should be specified."
    - paragraph [ref=f11e45]: "Further the following request parameters can be specified:"
    - paragraph [ref=f11e46]:
      - generic [ref=f11e47]: •
      - text: Trading instruments for which deals will be requested. One symbol or a group of symbols can be selected from the list. Optionally, you can specify a comma separated list of trading instruments or groups of symbols. For example, Forex\*, CFD\*, Metals\GOLD. Please note that filtering is performed on the server side, and not on the administrator terminal side. To obtain data on other instruments, send another request. The request is performed for all financial instruments by default.
    - paragraph [ref=f11e48]:
      - generic [ref=f11e49]: •
      - generic [ref=f11e50]:
        - text: You can specify one of predefined request periods using the
        - img "Time Frame" [ref=f11e51]
        - text: "button: \"Today\", \"Last 3 days\", \"Last week\", \"Last 3 months\", \"Last 6 months\" and \"All history\"."
    - paragraph [ref=f11e52]:
      - generic [ref=f11e53]: •
      - generic [ref=f11e54]:
        - text: You can set precise time limits of the request. Indicate them manually or using the calendar that is opened at a click on button
        - img "Calendar" [ref=f11e55]
        - text: .
    - paragraph [ref=f11e56]:
      - generic [ref=f11e57]: •
      - generic [ref=f11e58]:
        - text: "Further you can specify from which database deals should be requested: current database or one of"
        - link "backups" [ref=f11e59] [cursor=pointer]:
          - /url: admin_deals.htm#backup
        - text: .
    - paragraph [ref=f11e60]:
      - generic [ref=f11e61]:
        - text: To perform the request, press the "Request" button or execute the "
        - img "Request" [ref=f11e62]
        - text: Request" command of the
        - link "context menu" [ref=f11e63] [cursor=pointer]:
          - /url: admin_deals.htm#context
        - text: .
    - paragraph [ref=f11e64]: Viewing a Deal
    - paragraph [ref=f11e65]: To start viewing or editing a deal, double click on the selected deal in the list. The trading operation dialog is a fully-featured tool with a plethora of advanced features, such as the display of the structure of operations, visualization, tick history and logs.
    - paragraph [ref=f11e66]:
      - img "Deal" [ref=f11e67]
    - paragraph [ref=f11e68]: Account details
    - paragraph [ref=f11e69]:
      - generic [ref=f11e70]:
        - text: "The upper part of the dialog features brief information about the account, on which the operation was performed: name, login, groups and leverage. Click on this line to view"
        - link "account details" [ref=f11e71] [cursor=pointer]:
          - /url: account_edit.htm
        - text: .
    - paragraph [ref=f11e72]: Overview and related operations
    - paragraph [ref=f11e73]: "This block displays all the related trading operations: the order as a result of which the deal was executed, the position affected by the deal, as well as which initiated the operation, the deals performed as a result of order execution and the final position. Thus you can easily access the entire chain of related actions. Select an operation from the tree and all relevant parameters will be instantly displayed in the bottom part."
    - paragraph [ref=f11e74]: Trading operation details
    - paragraph [ref=f11e75]: "The following parameters are indicated for deals:"
    - paragraph [ref=f11e76]:
      - generic [ref=f11e77]: •
      - text: Login
      - generic [ref=f11e78]:
        - text: —
        - link "account" [ref=f11e79] [cursor=pointer]:
          - /url: admin_accounts.htm
        - text: number the deal has been performed on.
    - paragraph [ref=f11e80]:
      - generic [ref=f11e81]: •
      - text: Creation time — time of deal execution.
    - paragraph [ref=f11e82]:
      - generic [ref=f11e83]: •
      - text: Deal — a unique deal number.
    - paragraph [ref=f11e84]:
      - generic [ref=f11e85]: •
      - text: Order
      - generic [ref=f11e86]:
        - text: — ticket (number) of the
        - link "order" [ref=f11e87] [cursor=pointer]:
          - /url: admin_orders.htm
        - text: the deal was executed on.
    - paragraph [ref=f11e88]:
      - generic [ref=f11e89]: •
      - text: Position — ticket of the position that was opened or closed by this deal.
    - paragraph [ref=f11e90]:
      - generic [ref=f11e91]: •
      - text: Action
      - generic [ref=f11e92]:
        - text: — deal type, and the direction of the deal relative to the current
        - link "position" [ref=f11e93] [cursor=pointer]:
          - /url: admin_positions.htm
        - text: "of the account: in (entry), out (exit), in/out (position reverse) or out by (closing position with an opposite one). There are the following types of deals:"
    - paragraph [ref=f11e94]:
      - generic [ref=f11e95]: •
      - text: Sell — selling a financial instrument.
    - paragraph [ref=f11e96]:
      - generic [ref=f11e97]: •
      - text: Buy — buying a financial instrument.
    - paragraph [ref=f11e98]:
      - generic [ref=f11e99]: •
      - text: Balance — top-up of balance via a manager terminal.
    - paragraph [ref=f11e100]:
      - generic [ref=f11e101]: •
      - text: Credit — crediting via a manager terminal.
    - paragraph [ref=f11e102]:
      - generic [ref=f11e103]: •
      - text: Charge — other financial operations on the account that do not belong to any of categories.
    - paragraph [ref=f11e104]:
      - generic [ref=f11e105]: •
      - text: Correction — manual correction of a client's balance.
    - paragraph [ref=f11e106]:
      - generic [ref=f11e107]: •
      - text: Bonus
      - generic [ref=f11e108]:
        - text: — accrual of bonuses. Operations of this type affect the credit assets of a client (
        - link "\"Credit\"" [ref=f11e109] [cursor=pointer]:
          - /url: account_edit.htm#personal
        - text: field).
    - paragraph [ref=f11e110]:
      - generic [ref=f11e111]: •
      - text: Commission — accrual of commission.
    - paragraph [ref=f11e112]:
      - generic [ref=f11e113]: •
      - text: Daily commission
      - generic [ref=f11e114]:
        - text: — deal of charging
        - link "commission" [ref=f11e115] [cursor=pointer]:
          - /url: commission_calculation.htm
        - text: at the end of a trading day.
    - paragraph [ref=f11e116]:
      - generic [ref=f11e117]: •
      - text: Monthly commission — deal of charging commission at the end of a month.
    - paragraph [ref=f11e118]:
      - generic [ref=f11e119]: •
      - text: Agent commission
      - generic [ref=f11e120]:
        - text: — deal of charging agent commission (used during an
        - link "instant charge" [ref=f11e121] [cursor=pointer]:
          - /url: groups_comissions.htm#charge
        - text: ).
    - paragraph [ref=f11e122]:
      - generic [ref=f11e123]: •
      - text: Daily agent commission — deal of accruing agent commission at the end of a trading day.
    - paragraph [ref=f11e124]:
      - generic [ref=f11e125]: •
      - text: Monthly agent commission — deal of accruing agent commission at the end of a month.
    - paragraph [ref=f11e126]:
      - generic [ref=f11e127]: •
      - text: Interest rate
      - generic [ref=f11e128]:
        - text: — deal of
        - link "accruing annual interest" [ref=f11e129] [cursor=pointer]:
          - /url: groups_settings.htm#interest
        - text: at the end of a month.
    - paragraph [ref=f11e130]:
      - generic [ref=f11e131]: •
      - text: Canceled buy and Canceled sell
      - generic [ref=f11e132]:
        - text: — canceled deal. Such deal types are possible, for example, when working with an external trading system via a
        - link "gateway" [ref=f11e133] [cursor=pointer]:
          - /url: admin_gateways.htm
        - text: . A deal can be canceled in an external trading system. In this case, the type of a previously performed deal in the platform (Buy or Sell) is changed to Canceled buy or Canceled sell respectively. At the same time, profit/loss of such a deal is reset. A client's position is then recalculated and an appropriate profit/loss is deposited/withdrawn in a separate balance deal. Deal cancellation does not entail changes in client orders history. Canceled buy and Canceled sell type deals do not participate in an account financial status calculation and are not considered in
        - link "positions recalculation" [ref=f11e134] [cursor=pointer]:
          - /url: account_edit.htm#check_fix
        - text: .
    - paragraph [ref=f11e135]:
      - generic [ref=f11e136]: •
      - text: Dividend — paying taxable dividends.
    - paragraph [ref=f11e137]:
      - generic [ref=f11e138]: •
      - text: Franked dividend — paying non-taxable dividends (tax is paid by a company, not a client).
    - paragraph [ref=f11e139]:
      - generic [ref=f11e140]: •
      - text: Tax — charging a tax.
    - paragraph [ref=f11e141]:
      - generic [ref=f11e142]: •
      - text: SO Compensation
      - generic [ref=f11e143]:
        - text: — negative balance
        - link "compensation" [ref=f11e144] [cursor=pointer]:
          - /url: groups_settings.htm#compensate
        - text: after a Stop Out.
    - paragraph [ref=f11e145]:
      - generic [ref=f11e146]: •
      - text: SO Credit Compensation
      - generic [ref=f11e147]:
        - text: —
        - link "resetting" [ref=f11e148] [cursor=pointer]:
          - /url: groups_settings.htm#so_credit
        - text: credit funds to zero after the negative balance compensation.
    - paragraph [ref=f11e149]:
      - generic [ref=f11e150]: •
      - text: Volume — deal volume.
    - paragraph [ref=f11e151]:
      - generic [ref=f11e152]: •
      - text: Closed volume — position volume closed by this deal. This field enables convenient working with reversal deals. In addition to the total volume of the executed deal, which is opposite to the current position, you can view the closed volume. This ability is especially useful if the initial reversed position is composed of several deals, and its total volume is not explicitly visible.
    - paragraph [ref=f11e153]:
      - generic [ref=f11e154]: •
      - text: Symbol
      - generic [ref=f11e155]:
        - text: —
        - link "financial instrument" [ref=f11e156] [cursor=pointer]:
          - /url: admin_symbols.htm
        - text: of the deal.
    - paragraph [ref=f11e157]:
      - generic [ref=f11e158]: •
      - text: Price — deal price.
    - paragraph [ref=f11e159]:
      - generic [ref=f11e160]: •
      - text: Value
      - generic [ref=f11e161]:
        - text: — deal value in client deposit currency. The rate of conversion to deposit currency is shown in the "Margin rate" field. The field is used only for
        - link "Exchange* calculation type" [ref=f11e162] [cursor=pointer]:
          - /url: symbol_settings_trade.htm#calculation
        - text: symbols and groups with the
        - link "\"for Stock Exchange, based on margin discount rates\" risk management type" [ref=f11e163] [cursor=pointer]:
          - /url: groups_settings.htm#risk
        - text: .
      - generic [ref=f11e164]:
        - text: "In case of exchange risk accounting, each deal affects the account balance: the deal value is charged or deducted from the balance. In other words, the system uses the Value field here (not the Profit one, as is the case with OTC accounting). The same applies to"
        - link "verifying the balance using the trading history" [ref=f11e165] [cursor=pointer]:
          - /url: account_edit.htm#check_fix
        - text: ": the values of deals (rather than their results) are verified. Thus, if you change the deal price for some reason, make sure to update the Value field as well, since it is not recalculated automatically. Otherwise, the value change result is not displayed on the account balance after its verification and correction using the trading history."
    - paragraph [ref=f11e166]:
      - generic [ref=f11e167]: •
      - text: Stop loss — the Stop Loss level. Stop Loss values for entry and reversal deals are set in accordance with the Stop Loss of orders, which initiated these deals. The Stop Loss values of appropriate positions as of the time of position closing are used for exit deals.
    - paragraph [ref=f11e168]:
      - generic [ref=f11e169]: •
      - text: Take profit — the Take Profit level. Take Profit values for entry and reversal deals are set in accordance with the Take Profit of orders, which initiated these deals. The Take Profit values of appropriate positions as of the time of position closing are used for exit deals.
    - paragraph [ref=f11e170]:
      - generic [ref=f11e171]: •
      - text: "Reason — reasons for deal execution:"
    - paragraph [ref=f11e172]:
      - generic [ref=f11e173]: •
      - text: Client — deal performed by a client manually through the client terminal.
    - paragraph [ref=f11e174]:
      - generic [ref=f11e175]: •
      - text: Expert — deal performed by a client with using an Expert Advisor.
    - paragraph [ref=f11e176]:
      - generic [ref=f11e177]: •
      - text: Dealer — deal performed by a dealer through the manager terminal.
    - paragraph [ref=f11e178]:
      - generic [ref=f11e179]: •
      - text: Stop loss — deal performed as a result of Stop Loss activation.
    - paragraph [ref=f11e180]:
      - generic [ref=f11e181]: •
      - text: Take profit — deal performed as a result of Take Profit activation.
    - paragraph [ref=f11e182]:
      - generic [ref=f11e183]: •
      - text: Stop out
      - generic [ref=f11e184]:
        - text: — deal performed when the client reached the
        - link "Stop out level" [ref=f11e185] [cursor=pointer]:
          - /url: groups_settings.htm#stopout
        - text: .
    - paragraph [ref=f11e186]:
      - generic [ref=f11e187]: •
      - text: Rollover
      - generic [ref=f11e188]:
        - text: — deal performed when reopening a position for charging
        - link "swaps" [ref=f11e189] [cursor=pointer]:
          - /url: symbol_settings_swaps.htm
        - text: .
    - paragraph [ref=f11e190]:
      - generic [ref=f11e191]: •
      - text: External Client — deal performed by a client from an external trading system.
    - paragraph [ref=f11e192]:
      - generic [ref=f11e193]: •
      - text: "Variation margin — deal performed for accruing variation margin. Such deals are executed in pairs: one deal closes an existing position in order to register the result (accrue the variation margin), the second deal re-opens the position with the same ticket, but at the new Close price. The position ticket is written to the \"Position\" field of both deals."
    - paragraph [ref=f11e194]:
      - generic [ref=f11e195]: •
      - text: Gateway — deal performed by a MetaTrader 5 gateway that had connected to the trading platform.
    - paragraph [ref=f11e196]:
      - generic [ref=f11e197]: •
      - text: Signal
      - generic [ref=f11e198]:
        - text: — deal performed as a result of copying a
        - link "trade signal" [ref=f11e199] [cursor=pointer]:
          - /url: https://www.mql5.com/en/signals
        - text: according to a subscription in the client terminal.
    - paragraph [ref=f11e200]:
      - generic [ref=f11e201]: •
      - text: Settlement — deal performed as a result of performing operations connected with the settlement of a futures contract/option. Not used at the moment.
    - paragraph [ref=f11e202]:
      - generic [ref=f11e203]: •
      - text: Transfer — deal performed due to transferring a position at the settlement price to a new symbol with the same underlying asset. Not used at the moment.
    - paragraph [ref=f11e204]:
      - generic [ref=f11e205]: •
      - text: Synchronization
      - generic [ref=f11e206]:
        - text: — deal performed as a result of
        - link "synchronization" [ref=f11e207] [cursor=pointer]:
          - /url: account_edit.htm#trade_accounts
        - text: of an account's trade state with an external system.
    - paragraph [ref=f11e208]:
      - generic [ref=f11e209]: •
      - text: External Service — deal performed from an external trading system for technical reasons (for example, to correct the trade state of a client).
    - paragraph [ref=f11e210]:
      - generic [ref=f11e211]: •
      - text: Mobile — deal performed from the MetaTrader 5 mobile terminal for Android or iPhone.
    - paragraph [ref=f11e212]:
      - generic [ref=f11e213]: •
      - text: Web — deal performed through the web terminal.
    - paragraph [ref=f11e214]:
      - generic [ref=f11e215]: •
      - text: Split — deal performed as a result of a symbol split.
    - paragraph [ref=f11e216]:
      - generic [ref=f11e217]: •
      - text: Corporate action — deal created as a result of a corporate action, such as consolidating or renaming securities, transferring a client to a different account, etc. API applications set this flag for service operations so that the platform does not account for such corporate actions in commission calculations.
    - paragraph [ref=f11e218]:
      - generic [ref=f11e219]: •
      - text: Migration — deal created while importing clients' trading operations from the MetaTrader 4 server.
    - paragraph [ref=f11e220]:
      - generic [ref=f11e221]: •
      - text: Ultency
      - generic [ref=f11e222]:
        - text: — deal received from Ultency. The value is used when your act as a
        - link "liquidity provider" [ref=f11e223] [cursor=pointer]:
          - /url: ultency_liquidity_offers.htm
        - text: .
    - paragraph [ref=f11e224]:
      - generic [ref=f11e225]: •
      - text: Coverage
      - generic [ref=f11e226]:
        - text: — such operations are used for
        - link "Ultency coverage accounts" [ref=f11e227] [cursor=pointer]:
          - /url: ultency_reporting.htm#coverage
        - text: ", which brokers can use to track the execution of deals by various criteria: A-Book and B-Book, by liquidity providers or by financial instruments. Coverage deals are specifically marked so that they can be excluded from commission calculations and explicitly filtered in server reports."
    - paragraph [ref=f11e228]:
      - generic [ref=f11e229]: •
      - text: Expert ID — the identifier (magic number) of an Expert Advisor that has executed this deal in the client terminal.
    - paragraph [ref=f11e230]:
      - generic [ref=f11e231]: •
      - text: Party ID — account number in the external system. This field is used for additional trade monitoring when operating as an Ultency liquidity provider.
      - generic [ref=f11e232]:
        - text: To connect to a liquidity provider in Ultency, a broker is assigned a single omnibus account through which all client orders are routed. By default, the liquidity provider has no information about the initiators of trading operations on the broker's side. If necessary, brokers can optionally transmit the trading account number for each executed operation. This can be done by enabling the '
        - link "Send Party ID" [ref=f11e233] [cursor=pointer]:
          - /url: ultency_connect.htm#party_id
        - text: "' option in connection settings."
      - text: The corresponding account numbers will be stored in the new 'Party ID' field in orders and deals routed to the provider. When reviewing trades on a broker's omnibus account, the liquidity provider will be able to distinguish between them.
    - paragraph [ref=f11e234]:
      - generic [ref=f11e235]: •
      - text: Commission
      - generic [ref=f11e236]:
        - text: — commission charged for deal execution. The field is only used for the standard commission charged immediately.
        - link "Commission" [ref=f11e237] [cursor=pointer]:
          - /url: groups_comissions.htm
        - text: settings are specified for each group separately.
    - paragraph [ref=f11e238]:
      - generic [ref=f11e239]: •
      - text: Fee
      - generic [ref=f11e240]:
        - text: — fee charged for deal execution. The field is used for the
        - link "Fee" [ref=f11e241] [cursor=pointer]:
          - /url: groups_comissions.htm#type
        - text: commission type.
    - paragraph [ref=f11e242]:
      - generic [ref=f11e243]: •
      - text: Agent commission
      - generic [ref=f11e244]:
        - text: — agent commission fees for the deal. Parameters of
        - link "agent commissions" [ref=f11e245] [cursor=pointer]:
          - /url: groups_comissions.htm
        - text: are specified for each group separately.
    - paragraph [ref=f11e246]:
      - generic [ref=f11e247]: •
      - text: Swap — charged swap.
    - paragraph [ref=f11e248]:
      - generic [ref=f11e249]: •
      - text: Profit — profit gained from the deal.
    - paragraph [ref=f11e250]:
      - generic [ref=f11e251]: •
      - text: Position price
      - generic [ref=f11e252]:
        - text: —
        - link "open price of a position" [ref=f11e253] [cursor=pointer]:
          - /url: admin_positions.htm#open_price
        - text: ", which has been closed by this deal. This field is filled for deals that have the \"out\" or \"in/out\" type."
    - paragraph [ref=f11e254]:
      - generic [ref=f11e255]: •
      - text: Gateway Price
      - generic [ref=f11e256]:
        - text: — the gateways provide a built-in option to set
        - link "markups" [ref=f11e257] [cursor=pointer]:
          - /url: gateways_config.htm#translation
        - text: for the prices arriving from an external system. Markups apply not only to prices shown in Market Watch, but also to prices at which trades are executed on the platform side. The "Gateway price" field contains the actual price at which the deal was executed on the external system side (before markups). For further details, please read "
        - link "Gateway price, volume, and action" [ref=f11e258] [cursor=pointer]:
          - /url: admin_deals.htm#gateway
        - text: "\"."
    - paragraph [ref=f11e259]:
      - generic [ref=f11e260]: •
      - text: Gateway
      - generic [ref=f11e261]:
        - text: — direction and volume with which the deal is actually routed to an external trading system through the gateway. For further details, please read "
        - link "Gateway price, volume, and action" [ref=f11e262] [cursor=pointer]:
          - /url: admin_deals.htm#gateway
        - text: "\"."
    - paragraph [ref=f11e263]:
      - generic [ref=f11e264]: •
      - text: Raw profit
      - generic [ref=f11e265]:
        - text: — profit/loss of the committed deal. The profit/loss is represented in the
        - link "profit currency of the symbol" [ref=f11e266] [cursor=pointer]:
          - /url: symbol_settings_currency.htm#profit_currency
        - text: the deal is performed by.
    - paragraph [ref=f11e267]:
      - generic [ref=f11e268]: •
      - text: Comment
      - generic [ref=f11e269]:
        - text: — a comment to the deal. Additional information can be written in the comment field. For example, a comment indicating an account for whose trades an agent receives the commission is automatically added to the
        - link "agent commission" [ref=f11e270] [cursor=pointer]:
          - /url: groups_comissions.htm
        - text: deals;
    - paragraph [ref=f11e271]:
      - generic [ref=f11e272]: •
      - text: External ID — a unique identifier of the deal in external systems.
    - paragraph [ref=f11e273]:
      - generic [ref=f11e274]: •
      - text: Dealer ID
      - generic [ref=f11e275]:
        - text: — the number of the
        - link "dealer's" [ref=f11e276] [cursor=pointer]:
          - /url: admin_managers.htm#dealing_permission
        - text: account who processed this deal. "0" specified in this field means that the deal was processed without a dealer.
    - paragraph [ref=f11e277]:
      - generic [ref=f11e278]: •
      - text: "Modifications — if the deal is changed manually, this field displays who implemented the changes:"
    - paragraph [ref=f11e279]:
      - generic [ref=f11e280]: •
      - text: Administrator — deal changed by an administrator.
    - paragraph [ref=f11e281]:
      - generic [ref=f11e282]: •
      - text: Manager — open price changed by a manager.
    - paragraph [ref=f11e283]:
      - generic [ref=f11e284]: •
      - text: Position — deal modification data was inherited from the position closed by that deal.
    - paragraph [ref=f11e285]:
      - generic [ref=f11e286]: •
      - text: Restore — deal restored.
