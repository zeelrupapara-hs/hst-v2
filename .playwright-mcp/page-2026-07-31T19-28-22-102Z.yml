  - generic [ref=f10e28]:
    - paragraph [ref=f10e29]: Orders
    - paragraph [ref=f10e30]: Using the "Orders" section, you can manage the history of orders placed by clients, pending orders and the orders that are not executed at the moment.
    - paragraph [ref=f10e31]:
      - img "Orders" [ref=f10e32]
    - paragraph [ref=f10e33]:
      - generic [ref=f10e34]:
        - text: Depending on the items chosen in the
        - link "context menu" [ref=f10e35] [cursor=pointer]:
          - /url: admin_orders.htm#context
        - text: ", different"
        - link "information about orders" [ref=f10e36] [cursor=pointer]:
          - /url: admin_orders.htm#view
        - text: is displayed here. Orders can be sorted out by any field. To do it, click with the left mouse button on its name.
    - paragraph [ref=f10e37]: Requesting Orders
    - paragraph [ref=f10e38]: "To view orders, compose a request. A request can be performed:"
    - paragraph [ref=f10e39]:
      - generic [ref=f10e40]: •
      - text: By Groups To do it, select a group from the dropdown list.
    - paragraph [ref=f10e41]:
      - generic [ref=f10e42]: •
      - text: By Logins To do it, should specify one or several logins separated with commas.
    - paragraph [ref=f10e43]:
      - generic [ref=f10e44]: •
      - text: By Tickets To request orders by their numbers specify one or several numbers separated with commas. Before the numbers it is necessary to specify the "#" symbols.
    - paragraph [ref=f10e45]: "Then you can specify the following parameters of the request:"
    - paragraph [ref=f10e46]:
      - generic [ref=f10e47]: •
      - text: Trading instruments for which orders will be requested. One symbol or a group of symbols can be selected from the list. Optionally, you can specify a comma separated list of trading instruments or groups of symbols. For example, Forex\*, CFD\*, Metals\GOLD. Please note that filtering is performed on the server side, and not on the administrator terminal side. To obtain data on other instruments, send another request. The request is performed for all financial instruments by default.
    - paragraph [ref=f10e48]:
      - generic [ref=f10e49]: •
      - text: If you check the "Open only" option then only the pending orders that haven't triggered yet will be displayed.
    - paragraph [ref=f10e50]:
      - generic [ref=f10e51]: •
      - generic [ref=f10e52]:
        - text: Then you can specify one of the predefined periods of request using the
        - img "Period" [ref=f10e53]
        - text: "button: \"Today\", \"Last 3 days\", \"Last week\", \"Last 3 months\", \"Last 6 months\" and \"All history\". To specify a custom request period, use the fields to the right. Orders are requested based on the execution time. Open orders do not have this parameter, so they will be included in all queries."
    - paragraph [ref=f10e54]:
      - generic [ref=f10e55]: •
      - generic [ref=f10e56]:
        - text: "Then you can specify a database the orders will be requested from: current database or one of the"
        - link "backups" [ref=f10e57] [cursor=pointer]:
          - /url: admin_orders.htm#backup
        - text: .
    - paragraph [ref=f10e58]:
      - generic [ref=f10e59]:
        - text: To execute the request, press the "Request" button or execute the "
        - img "Request" [ref=f10e60]
        - text: Request" command in the
        - link "context menu" [ref=f10e61] [cursor=pointer]:
          - /url: admin_orders.htm#request
        - text: .
    - paragraph [ref=f10e62]: Viewing an Order
    - paragraph [ref=f10e63]: To start viewing or editing an order, double-click on it in the list. The trading operation dialog is a fully-featured tool with a plethora of advanced features, such as the display of the structure of operations, visualization, tick history and logs.
    - paragraph [ref=f10e64]:
      - img "Order" [ref=f10e65]
    - paragraph [ref=f10e66]: Account details
    - paragraph [ref=f10e67]:
      - generic [ref=f10e68]:
        - text: "The upper part of the dialog features brief information about the account, on which the operation was performed: name, login, group and leverage. Click on this line to view"
        - link "account details" [ref=f10e69] [cursor=pointer]:
          - /url: account_edit.htm
        - text: .
    - paragraph [ref=f10e70]: Overview and related operations
    - paragraph [ref=f10e71]: "All related trading operations are shown in this block: deals executed as a result of order execution and the resulting position. Thus you can easily access the entire chain of related actions. Select an operation from the tree and all relevant parameters will be instantly displayed in the bottom part."
    - paragraph [ref=f10e72]: Trading operation details
    - paragraph [ref=f10e73]: "The following parameters are indicated for orders:"
    - paragraph [ref=f10e74]:
      - generic [ref=f10e75]: •
      - text: Login
      - generic [ref=f10e76]:
        - text: —
        - link "account" [ref=f10e77] [cursor=pointer]:
          - /url: admin_accounts.htm
        - text: number the order was placed on;
    - paragraph [ref=f10e78]:
      - generic [ref=f10e79]: •
      - text: Order — order number (ticket);
    - paragraph [ref=f10e80]:
      - generic [ref=f10e81]: •
      - text: "Setup time — time when the order was placed by the client. If the order is processed in an external trading system, this field displays the time of order placing in the external system (not in the MetaTrader 5 platform). When Stop Limit orders are triggered, a new value is written to this field, instead of the time the order was placed by the client: the time when the corresponding limit order was placed."
    - paragraph [ref=f10e82]:
      - generic [ref=f10e83]: •
      - text: "Position — ticket of the position opened, modified or closed due to this order. For \"close by\" orders, two tickets are displayed: closed position ticket and opposite position ticket."
    - paragraph [ref=f10e84]:
      - generic [ref=f10e85]: •
      - text: "Type — order type: \"Buy\", \"Sell\", \"Buy Limit\", \"Sell Limit\", \"Buy Stop\", \"Sell Stop\", \"Buy Stop Limit\", \"Sell Stop Limit\" or \"Close By\";"
    - paragraph [ref=f10e86]:
      - generic [ref=f10e87]: •
      - text: Initial volume — volume requested in the order;
    - paragraph [ref=f10e88]:
      - generic [ref=f10e89]: •
      - text: Symbol
      - generic [ref=f10e90]:
        - text: —
        - link "symbol" [ref=f10e91] [cursor=pointer]:
          - /url: admin_symbols.htm
        - text: the order was placed for;
    - paragraph [ref=f10e92]:
      - generic [ref=f10e93]: •
      - text: Filling
      - generic [ref=f10e94]:
        - text: — additional parameters of
        - link "order execution" [ref=f10e95] [cursor=pointer]:
          - /url: general_concept.htm#fill_policy
        - text: ": \"All or none\", \"Cancel remainder\", \"Book or Cancel\" or \"Return remainder\"."
    - paragraph [ref=f10e96]:
      - generic [ref=f10e97]: •
      - text: Order price — price specified by trader for execution of the order;
    - paragraph [ref=f10e98]:
      - generic [ref=f10e99]: •
      - text: Trigger price — this field is intended for the "Buy Stop Limit" and "Sell Stop Limit" orders. It contains the price level when they trigger and the corresponding limit orders are placed.
    - paragraph [ref=f10e100]:
      - generic [ref=f10e101]: •
      - text: Stop loss — the Stop Loss level;
    - paragraph [ref=f10e102]:
      - generic [ref=f10e103]: •
      - text: Take profit — the Take Profit level;
    - paragraph [ref=f10e104]:
      - generic [ref=f10e105]: •
      - text: Comment — text comment to the order. This field can contain trader's comments if they were specified.
    - paragraph [ref=f10e106]:
      - generic [ref=f10e107]: •
      - text: Margin rate — rate of converting the symbol margin currency to the deposit currency.
    - paragraph [ref=f10e108]:
      - generic [ref=f10e109]: •
      - text: Expiration
      - generic [ref=f10e110]:
        - text: —
        - link "expiration type" [ref=f10e111] [cursor=pointer]:
          - /url: symbol_settings_trade.htm#expiration
        - text: "of the order: \"GTC\" (Good Till Canceled), \"Day\" or \"Specified\"."
    - paragraph [ref=f10e112]:
      - generic [ref=f10e113]: •
      - text: Expiration time — if lifetime of the order has expired then this field contains the date and time of expiration;
    - paragraph [ref=f10e114]:
      - generic [ref=f10e115]: •
      - text: Disable activation
      - generic [ref=f10e116]:
        - text: — additional conditions (flags), with which order activation is prohibited. The flags can be set by Gateway API when orders are sent to an external system. For example, if activation of stop loss and take profit must be controlled by an external system, a flag disabling activation on the MetaTrader 5 side can be set for the order. Order flags are inherited by
        - link "positions" [ref=f10e117] [cursor=pointer]:
          - /url: admin_positions.htm#activation
        - text: "created upon order execution. Available flags:"
    - paragraph [ref=f10e118]:
      - generic [ref=f10e119]: •
      - text: Limit — no processing of limit level hitting.
    - paragraph [ref=f10e120]:
      - generic [ref=f10e121]: •
      - text: Stop — no processing of stop level hitting.
    - paragraph [ref=f10e122]:
      - generic [ref=f10e123]: •
      - text: Stop Limit — no processing of stop limit level hitting.
    - paragraph [ref=f10e124]:
      - generic [ref=f10e125]: •
      - text: SL — no processing of Stop Loss activation.
    - paragraph [ref=f10e126]:
      - generic [ref=f10e127]: •
      - text: TP — no processing of Take Profit activation.
    - paragraph [ref=f10e128]:
      - generic [ref=f10e129]: •
      - text: Stop Out — no processing of Stop Out activation.
    - paragraph [ref=f10e130]:
      - generic [ref=f10e131]: •
      - text: Expiration — no processing of expired order cancellation.
    - paragraph [ref=f10e132]:
      - generic [ref=f10e133]: •
      - text: "Modifications — if the order is changed manually, this field displays who implemented the changes:"
    - paragraph [ref=f10e134]:
      - generic [ref=f10e135]: •
      - text: Administrator — order changed by an administrator.
    - paragraph [ref=f10e136]:
      - generic [ref=f10e137]: •
      - text: Manager — open price changed by a manager.
    - paragraph [ref=f10e138]:
      - generic [ref=f10e139]: •
      - text: Restore — order restored.
    - paragraph [ref=f10e140]:
      - generic [ref=f10e141]: •
      - text: Admin API — order changed via Manager API administrator interface.
    - paragraph [ref=f10e142]:
      - generic [ref=f10e143]: •
      - text: Manager API — order changed via Manager API manager interface.
    - paragraph [ref=f10e144]:
      - generic [ref=f10e145]: •
      - text: Server API — order changed via Server API.
    - paragraph [ref=f10e146]:
      - generic [ref=f10e147]: •
      - text: Gateway API — order changed via Gateway API.
    - table [ref=f10e149]:
      - rowgroup [ref=f10e150]:
        - row [ref=f10e151]:
          - cell "• The orders changed by an administrator or manager, as well as restored orders are highlighted in the list in red. • Use Trade Modification Report to obtain information about all modified trade operations." [ref=f10e152]:
            - paragraph [ref=f10e153]:
              - generic [ref=f10e154]: •
              - text: The orders changed by an administrator or manager, as well as restored orders are highlighted in the list in red.
            - paragraph [ref=f10e155]:
              - generic [ref=f10e156]: •
              - generic [ref=f10e157]:
                - text: Use
                - link "Trade Modification Report" [ref=f10e158] [cursor=pointer]:
                  - /url: trade_modification_report.htm
                - text: to obtain information about all modified trade operations.
    - paragraph [ref=f10e159]:
      - generic [ref=f10e160]: •
      - text: "Reason — reason of placing the order:"
    - paragraph [ref=f10e161]:
      - generic [ref=f10e162]: •
      - text: Client — order placed manually by a client via the client terminal;
    - paragraph [ref=f10e163]:
      - generic [ref=f10e164]: •
      - text: Expert — order placed by a client using an Expert Advisor;
    - paragraph [ref=f10e165]:
      - generic [ref=f10e166]: •
      - text: Dealer — order placed by a dealer via the manager terminal;
    - paragraph [ref=f10e167]:
      - generic [ref=f10e168]: •
      - text: SL — order placed as a result of Stop Loss triggering;
    - paragraph [ref=f10e169]:
      - generic [ref=f10e170]: •
      - text: TP — order placed as a result of Take Profit triggering;
    - paragraph [ref=f10e171]:
      - generic [ref=f10e172]: •
      - text: SO
      - generic [ref=f10e173]:
        - text: — order placed because a client reached the
        - link "Stop-Out" [ref=f10e174] [cursor=pointer]:
          - /url: groups_settings.htm#stopout
        - text: level;
    - paragraph [ref=f10e175]:
      - generic [ref=f10e176]: •
      - text: Rollover
      - generic [ref=f10e177]:
        - text: — order placed when reopening position for charging
        - link "swaps" [ref=f10e178] [cursor=pointer]:
          - /url: symbol_settings_swaps.htm
        - text: ;
    - paragraph [ref=f10e179]:
      - generic [ref=f10e180]: •
      - text: External Client — order placed by a client from an external trading system.
    - paragraph [ref=f10e181]:
      - generic [ref=f10e182]: •
      - text: Variation margin — order placed for accruing variation margin.
    - paragraph [ref=f10e183]:
      - generic [ref=f10e184]: •
      - text: Gateway — order placed by a MetaTrader 5 gateway that had connected to the trading platform.
    - paragraph [ref=f10e185]:
      - generic [ref=f10e186]: •
      - text: Signal
      - generic [ref=f10e187]:
        - text: — order placed as a result of copying a
        - link "trade signal" [ref=f10e188] [cursor=pointer]:
          - /url: https://www.mql5.com/en/signals
        - text: according to a subscription in the client terminal.
    - paragraph [ref=f10e189]:
      - generic [ref=f10e190]: •
      - text: Settlement — order placed as a result of performing operations connected with the settlement of a futures contract/option. Not used at the moment.
    - paragraph [ref=f10e191]:
      - generic [ref=f10e192]: •
      - text: Transfer — order placed due to transferring a position at the settlement price to a new symbol with the same underlying asset. Not used at the moment.
    - paragraph [ref=f10e193]:
      - generic [ref=f10e194]: •
      - text: Synchronization
      - generic [ref=f10e195]:
        - text: — order placed as a result of
        - link "synchronization" [ref=f10e196] [cursor=pointer]:
          - /url: account_edit.htm#trade_accounts
        - text: of an account's trade state with an external system.
    - paragraph [ref=f10e197]:
      - generic [ref=f10e198]: •
      - text: External Service — order placed from an external trading system for technical reasons (for example, to correct the trade state of a client).
    - paragraph [ref=f10e199]:
      - generic [ref=f10e200]: •
      - text: Mobile — order created via the MetaTrader 5 mobile terminal for Android or iPhone.
    - paragraph [ref=f10e201]:
      - generic [ref=f10e202]: •
      - text: Web — order created via the web terminal.
    - paragraph [ref=f10e203]:
      - generic [ref=f10e204]: •
      - text: Split — order created as a result of a symbol split.
    - paragraph [ref=f10e205]:
      - generic [ref=f10e206]: •
      - text: Corporate action — order created as a result of a corporate action, such as consolidating or renaming securities, transferring a client to a different account, etc. API applications set this flag for service operations so that the platform does not account for such corporate actions in commission calculations.
    - paragraph [ref=f10e207]:
      - generic [ref=f10e208]: •
      - text: Migration — order created while importing clients' trading operations from the MetaTrader 4 server.
    - paragraph [ref=f10e209]:
      - generic [ref=f10e210]: •
      - text: Ultency
      - generic [ref=f10e211]:
        - text: — order received from Ultency. The value is used when your act as a
        - link "liquidity provider" [ref=f10e212] [cursor=pointer]:
          - /url: ultency_liquidity_offers.htm
        - text: .
    - paragraph [ref=f10e213]:
      - generic [ref=f10e214]: •
      - text: Coverage
      - generic [ref=f10e215]:
        - text: — such operations are used for
        - link "Ultency coverage accounts" [ref=f10e216] [cursor=pointer]:
          - /url: ultency_reporting.htm#coverage
        - text: ", which brokers can use to track the execution of deals by various criteria: A-Book and B-Book, by liquidity providers or by financial instruments. Coverage deals are specifically marked so that they can be excluded from commission calculations and explicitly filtered in server reports."
    - paragraph [ref=f10e217]:
      - generic [ref=f10e218]: •
      - text: Expert ID — the identifier (magic number) of an Expert Advisor that has sent this order from the client terminal.
    - paragraph [ref=f10e219]:
      - generic [ref=f10e220]: •
      - text: Party ID — account number in the external system. This field is used for additional trade monitoring when operating as an Ultency liquidity provider.
      - generic [ref=f10e221]:
        - text: To connect to a liquidity provider in Ultency, a broker is assigned a single omnibus account through which all client orders are routed. By default, the liquidity provider has no information about the initiators of trading operations on the broker's side. If necessary, brokers can optionally transmit the trading account number for each executed operation. This can be done by enabling the '
        - link "Send Party ID" [ref=f10e222] [cursor=pointer]:
          - /url: ultency_connect.htm#party_id
        - text: "' option in connection settings."
      - text: The corresponding account numbers will be stored in the new 'Party ID' field in orders and deals routed to the provider. When reviewing trades on a broker's omnibus account, the liquidity provider will be able to distinguish between them.
    - paragraph [ref=f10e223]:
      - generic [ref=f10e224]: •
      - text: Done time — time when the order was executed. If the order is processed in an external trading system, this field displays the time of order execution in the external system (not in the MetaTrader 5 platform);
    - paragraph [ref=f10e225]:
      - generic [ref=f10e226]: •
      - text: State — current state of the order (filled, rejected, partially filled, expired, etc.). Editing allowed for emergency situations only. It is strongly not recommended to change this setting manually without a special need;
    - paragraph [ref=f10e227]:
      - generic [ref=f10e228]: •
      - text: Current price — current price of the symbol the pending order was placed for. For market orders, a value from the "Order price" field is displayed here;
    - paragraph [ref=f10e229]:
      - generic [ref=f10e230]: •
      - text: Remained volume — if the order is not filled in the volume requested by trader this field will display the remainder volume;
    - paragraph [ref=f10e231]:
      - generic [ref=f10e232]: •
      - text: External ID — unique identifier of the order in the external systems.
    - paragraph [ref=f10e233]:
      - generic [ref=f10e234]: •
      - text: Dealer ID
      - generic [ref=f10e235]:
        - text: — number of account of the
        - link "dealer" [ref=f10e236] [cursor=pointer]:
          - /url: admin_managers.htm#dealing_permission
        - text: that processed this order. If "0" is specified in this field, it means that the order was processed without a dealer.
    - paragraph [ref=f10e237]:
      - generic [ref=f10e238]:
        - text: If a manager has access rights for
        - link "modifying orders" [ref=f10e239] [cursor=pointer]:
          - /url: admin_managers.htm#dealing_permission
        - text: then any field in this window can be modified. As soon as all the changes are made, the "Update" button should be pressed. If you press the "Delete" button the order will be deleted from the currently selected database.
    - paragraph [ref=f10e240]: Visualization
    - paragraph [ref=f10e241]: In this section, execution of a trading operation is visualized on the tick chart of the appropriate symbol.
    - paragraph [ref=f10e242]:
      - img "Trading visualization" [ref=f10e243]
    - paragraph [ref=f10e244]: Nearest ticks before and after the operation
    - paragraph [ref=f10e245]: When examining disputable situations with traders, it is often necessary to analyze quotes which were broadcasted at the trading operation execution time. The relevant quote data can be obtained in a couple of clicks. Open operation details and navigate to the "Ticks" section. The terminal will automatically request the quote history from the server for the entire day on which the operation was performed. The nearest quote to operation execution time will be automatically selected in the list of received quotes.
    - paragraph [ref=f10e246]:
      - img "Nearest ticks before and after the operation" [ref=f10e247]
    - paragraph [ref=f10e248]: Operation journal
    - paragraph [ref=f10e249]:
      - generic [ref=f10e250]:
        - text: This is another tool to assist during the follow-up operation examination. There is no need to manually request
        - link "logs from the server" [ref=f10e251] [cursor=pointer]:
          - /url: network_journal.htm
        - text: and to filter its records. Open operation details, navigate to the "Journal" section and the terminal will automatically request the necessary logs from the server, using ticket and time interval filters (from the operation date to the current day).
    - paragraph [ref=f10e252]:
      - img "Operation journal" [ref=f10e253]
    - paragraph [ref=f10e254]: Trading operation report
    - paragraph [ref=f10e255]: The trading operation details available in the editing dialogs can be saved as a report. The report contains the entire chain of operations from an order to a position, visualization on a tick chart, extract from the server log and the trading account overall status.
    - paragraph [ref=f10e256]:
      - generic [ref=f10e257]:
        - text: To generate a file, click "Report" in the context menu in the "
        - link "Overview and related operations" [ref=f10e258] [cursor=pointer]:
          - /url: admin_orders.htm#connected_transactions
        - text: "\" section. Next, select data to be saved: account state, trading totals, logs, tick chart, etc."
    - paragraph [ref=f10e259]:
      - img "Trading operation report" [ref=f10e260]
    - paragraph [ref=f10e261]: Select the path on the disk and click "Save".
    - paragraph [ref=f10e262]: Moving Orders to History
    - paragraph [ref=f10e263]: "Any open order can be move canceled and moved to history. At that, its state will be changed to \"Canceled\". Click \"To history\":"
    - paragraph [ref=f10e264]:
      - img "Moving the order to history" [ref=f10e265]
    - paragraph [ref=f10e266]: Orders moved to history cannot trigger or be executed; also margin is not charged for them.
    - paragraph [ref=f10e267]: Reopening Orders
    - paragraph [ref=f10e268]: "Pending orders can be reopened from the orders' trading history. Before reopening the order, client's trading positions and account should be properly corrected:"
    - paragraph [ref=f10e269]:
      - generic [ref=f10e270]: •
      - text: Delete the trade opened according to the order.
    - paragraph [ref=f10e271]:
      - generic [ref=f10e272]: •
      - generic [ref=f10e273]:
        - text: Correct the client's positions using the special command. To do this, open the account's dialog window and execute
        - link "\"Fix Positions\"" [ref=f10e274] [cursor=pointer]:
          - /url: account_edit.htm#check_fix
        - text: context menu command in the Overview tab.
    - paragraph [ref=f10e275]:
      - generic [ref=f10e276]: •
      - generic [ref=f10e277]:
        - text: Correct the client's balance. Select the appropriate account in the list and execute
        - link "\"Balance->Fix Balance\"" [ref=f10e278] [cursor=pointer]:
          - /url: account_balance_check.htm
        - text: context menu command.
    - paragraph [ref=f10e279]: "After that, the triggered order can be reopened. To do this, move to Orders section, find the necessary order, open it for editing and click \"Reopen\":"
    - paragraph [ref=f10e280]:
      - img "Reopening an order" [ref=f10e281]
    - paragraph [ref=f10e282]: Backup Databases of Orders
    - paragraph [ref=f10e283]:
      - generic [ref=f10e284]:
        - link "Backup copies" [ref=f10e285] [cursor=pointer]:
          - /url: backup_server_features.htm#file
        - text: are copies of the order database at certain points in time. They are created daily on the
        - link "backup server" [ref=f10e286] [cursor=pointer]:
          - /url: network_backup_server.htm#enable_backups
        - text: ". To get the list of available backup copies, select \"More backups...\" and specify a time period:"
    - paragraph [ref=f10e287]:
      - img "Period of backups" [ref=f10e288]
    - paragraph [ref=f10e289]:
      - generic [ref=f10e290]:
        - text: After specifying a period the additional items will appear in the field of choosing database — all the backups made for the specified period of time. Then you should
        - link "request" [ref=f10e291] [cursor=pointer]:
          - /url: admin_orders.htm#request
        - text: orders from the selected database. Any order can be restored to the current database using the "
        - img "Restore" [ref=f10e292]
        - text: Restore" command of the context menu.
    - table [ref=f10e294]:
      - rowgroup [ref=f10e295]:
        - row [ref=f10e296]:
          - cell [ref=f10e297]:
