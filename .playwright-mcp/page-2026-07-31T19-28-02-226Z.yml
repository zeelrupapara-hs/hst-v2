          - cell [ref=f9e328]:
            - paragraph [ref=f9e329]: The rate of conversion of the margin currency of the symbol to the deposit currency of the user, which is used when calculating the margin requirements for the order.
        - row [ref=f9e330]:
          - cell [ref=f9e331]:
            - paragraph [ref=f9e332]: ApiData
          - cell [ref=f9e333]:
            - paragraph [ref=f9e334]: String
          - cell [ref=f9e335]:
            - paragraph [ref=f9e336]: "User data which can be added via MetaTrader 5 API. Sample user data entry: [{pos:0,app_id:1,valInt:500,valUInt:500,valDbl:0.00000000}]. It specifies the user data index, the ID of the application that added it, as well as the data of three types: Int, UInt and double. The string may contain up to 16 such entries."