          - cell [ref=f13e735]:
            - paragraph [ref=f13e736]: The normal mode of instant execution.
    - paragraph [ref=f13e737]: EnInstantFlags
    - paragraph [ref=f13e738]: Options for the Instant execution mode are enumerated in EnInstantFlags.
    - table [ref=f13e740]:
      - rowgroup [ref=f13e741]:
        - row [ref=f13e742]:
          - columnheader [ref=f13e743]:
            - paragraph [ref=f13e744]: Identifier
          - columnheader [ref=f13e745]:
            - paragraph [ref=f13e746]: Value
          - columnheader [ref=f13e747]:
            - paragraph [ref=f13e748]: Description
      - rowgroup [ref=f13e749]:
        - row [ref=f13e750]:
          - cell [ref=f13e751]:
            - paragraph [ref=f13e752]: INSTANT_FLAGS_NONE
          - cell [ref=f13e753]:
            - paragraph [ref=f13e754]: "0"
          - cell [ref=f13e755]:
            - paragraph [ref=f13e756]: No flags.
        - row [ref=f13e757]:
          - cell [ref=f13e758]:
            - paragraph [ref=f13e759]: INSTANT_FLAGS_FAST_CONFIRMATION
          - cell [ref=f13e760]:
            - paragraph [ref=f13e761]: "1"
          - cell [ref=f13e762]:
            - paragraph [ref=f13e763]: The option is disabled by default. When creating a trade request in the instant execution mode, the client can specify tolerance, i.e. by how many points the request execution price can differ from the price specified in the order. If a dealer returns a requote in response to such a request, and the requote price is within the tolerable deviation specified by the client, the order will be returned to the dealer for confirmation after the client confirms this new price. If the option is enabled, the order will be executed immediately after the client confirms the price. No additional confirmation from a dealer is required.
    - paragraph [ref=f13e764]: EnRequestFlags
    - paragraph [ref=f13e765]: Options of the Request execution mode are enumerated in EnRequestFlags.
    - table [ref=f13e767]:
      - rowgroup [ref=f13e768]:
