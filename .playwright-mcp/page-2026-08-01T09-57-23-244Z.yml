            - paragraph [ref=f13e614]: SWAP_BY_PROFIT_CURRENCY
          - cell [ref=f13e615]:
            - paragraph [ref=f13e616]: "9"
          - cell [ref=f13e617]:
            - paragraph [ref=f13e618]: Swap charging in the profit currency of a symbol.
