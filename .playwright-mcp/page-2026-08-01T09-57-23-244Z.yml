    - paragraph [ref=f13e118]: EnFillingFlags
    - paragraph [ref=f13e119]: The order filling methods allowed for a symbol are enumerated in EnFillingFlags.
    - table [ref=f13e121]:
      - rowgroup [ref=f13e122]:
        - row [ref=f13e123]:
          - columnheader [ref=f13e124]:
            - paragraph [ref=f13e125]: ID
          - columnheader [ref=f13e126]:
            - paragraph [ref=f13e127]: Value
          - columnheader [ref=f13e128]:
            - paragraph [ref=f13e129]: Description
      - rowgroup [ref=f13e130]:
        - row [ref=f13e131]:
          - cell [ref=f13e132]:
            - paragraph [ref=f13e133]: FILL_FLAGS_NONE
          - cell [ref=f13e134]:
            - paragraph [ref=f13e135]: "0"
          - cell [ref=f13e136]:
            - paragraph [ref=f13e137]: All filling methods are disabled.
        - row [ref=f13e138]:
          - cell [ref=f13e139]:
            - paragraph [ref=f13e140]: FILL_FLAGS_FOK
          - cell [ref=f13e141]:
            - paragraph [ref=f13e142]: "1"
          - cell [ref=f13e143]:
            - paragraph [ref=f13e144]: The "Fill or Kill" mode. The order must be filled completely or canceled. This type of filling is automatically set for the instant and request execution.
        - row [ref=f13e145]:
          - cell [ref=f13e146]:
            - paragraph [ref=f13e147]: FILL_FLAGS_IOC
          - cell [ref=f13e148]:
            - paragraph [ref=f13e149]: "2"
          - cell [ref=f13e150]:
            - paragraph [ref=f13e151]: Immediate or Cancel. An order can be filled partially and the residual volume is canceled. This type of filling is only available for the stock and market execution.
    - paragraph [ref=f13e152]: EnExpirationFlags
    - paragraph [ref=f13e153]: Types of orders allowed for the symbol are enumerated in EnExpirationFlags.
    - table [ref=f13e155]:
      - rowgroup [ref=f13e156]:
        - row [ref=f13e157]:
