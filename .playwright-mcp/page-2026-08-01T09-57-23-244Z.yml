        - row [ref=f13e708]:
          - cell [ref=f13e709]:
            - paragraph [ref=f13e710]: SWAP_FLAGS_CONSIDER_HOLIDAYS
          - cell [ref=f13e711]:
            - paragraph [ref=f13e712]: "1"
          - cell [ref=f13e713]:
            - paragraph [ref=f13e714]:
              - generic [ref=f13e715]:
                - text: Account for holidays when calculating swaps. If the flag is enabled, the platform checks all
                - link "holiday" [ref=f13e716] [cursor=pointer]:
                  - /url: admin_holidays.htm
                - text: configurations. The day before the holiday, the swap is doubled. No swap is charged on the day of the holiday.
    - paragraph [ref=f13e717]: EnInstantMode
    - paragraph [ref=f13e718]: Types of check for the instant execution mode are enumerate in EnInstantMode.
    - table [ref=f13e720]:
