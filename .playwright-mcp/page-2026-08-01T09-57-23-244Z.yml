            - paragraph [ref=f13e167]: TIME_FLAGS_NONE
          - cell [ref=f13e168]:
            - paragraph [ref=f13e169]: "0"
          - cell [ref=f13e170]:
            - paragraph [ref=f13e171]: All expiration types are disabled.
        - row [ref=f13e172]:
          - cell [ref=f13e173]:
            - paragraph [ref=f13e174]: TIME_FLAGS_GTC
          - cell [ref=f13e175]:
            - paragraph [ref=f13e176]: "1"
          - cell [ref=f13e177]:
            - paragraph [ref=f13e178]: Orders are good till canceled.
        - row [ref=f13e179]:
          - cell [ref=f13e180]:
            - paragraph [ref=f13e181]: TIME_FLAGS_DAY
          - cell [ref=f13e182]:
            - paragraph [ref=f13e183]: "2"
          - cell [ref=f13e184]:
            - paragraph [ref=f13e185]: Orders are effective only during the current trading day.
        - row [ref=f13e186]:
          - cell [ref=f13e187]:
            - paragraph [ref=f13e188]: TIME_FLAGS_SPECIFIED
          - cell [ref=f13e189]:
            - paragraph [ref=f13e190]: "4"
          - cell [ref=f13e191]:
            - paragraph [ref=f13e192]: Orders are effective till the date specified by the trader.
        - row [ref=f13e193]:
          - cell [ref=f13e194]:
            - paragraph [ref=f13e195]: TIME_FLAGS_SPECIFIED_DAY
          - cell [ref=f13e196]:
            - paragraph [ref=f13e197]: "8"
          - cell [ref=f13e198]:
            - paragraph [ref=f13e199]: Orders that expire at the specified day. An order expires at 00:00 of the specified day or the nearOrders with expiration at a specified day. An order expires at 00:00 of a specified day or at a nearest trade time.est trading time.
