            - paragraph [ref=f13e559]: SWAP_BY_SYMBOL_CURRENCY
          - cell [ref=f13e560]:
            - paragraph [ref=f13e561]: "2"
          - cell [ref=f13e562]:
            - paragraph [ref=f13e563]: Swap charging in the base currency of a symbol.
        - row [ref=f13e564]:
          - cell [ref=f13e565]:
            - paragraph [ref=f13e566]: SWAP_BY_MARGIN_CURRENCY
          - cell [ref=f13e567]:
            - paragraph [ref=f13e568]: "3"
          - cell [ref=f13e569]:
            - paragraph [ref=f13e570]: Swap charging in the margin currency of a symbol.
        - row [ref=f13e571]:
          - cell [ref=f13e572]:
            - paragraph [ref=f13e573]: SWAP_BY_GROUP_CURRENCY
          - cell [ref=f13e574]:
            - paragraph [ref=f13e575]: "4"
          - cell [ref=f13e576]:
            - paragraph [ref=f13e577]: Swap charging in the group (deposit) currency.
        - row [ref=f13e578]:
          - cell [ref=f13e579]:
            - paragraph [ref=f13e580]: SWAP_BY_INTEREST_CURRENT
          - cell [ref=f13e581]:
            - paragraph [ref=f13e582]: "5"
          - cell [ref=f13e583]:
            - paragraph [ref=f13e584]: Swap charging as a per cent from the price of a symbol at calculation of swap.
        - row [ref=f13e585]:
          - cell [ref=f13e586]:
            - paragraph [ref=f13e587]: SWAP_BY_INTEREST_OPEN
          - cell [ref=f13e588]:
            - paragraph [ref=f13e589]: "6"
          - cell [ref=f13e590]:
            - paragraph [ref=f13e591]: Swap charging as a per cent from the open price of a position by a symbol.
        - row [ref=f13e592]:
          - cell [ref=f13e593]:
            - paragraph [ref=f13e594]: SWAP_REOPEN_BY_CLOSE_PRICE
          - cell [ref=f13e595]:
            - paragraph [ref=f13e596]: "7"
          - cell [ref=f13e597]:
            - paragraph [ref=f13e598]:
              - generic [ref=f13e599]:
                - text: Swap charging by reopening position. At the end of a trading day position is closed. Next day it is reopened by the close price +/- number of points specified using the
                - link "SwapLong" [ref=f13e600] [cursor=pointer]:
                  - /url: sql_mt5_symbols.htm
                - text: and
                - link "SwapShort" [ref=f13e601] [cursor=pointer]:
                  - /url: sql_mt5_symbols.htm
                - text: parameters.
        - row [ref=f13e602]:
          - cell [ref=f13e603]:
            - paragraph [ref=f13e604]: SWAP_REOPEN_BY_BID
          - cell [ref=f13e605]:
            - paragraph [ref=f13e606]: "8"
          - cell [ref=f13e607]:
            - paragraph [ref=f13e608]:
              - generic [ref=f13e609]:
                - text: Swap charging by reopening position. At the end of a trading day position is closed. Next day it is reopened by the current Bid price +/- number of points specified using the
                - link "SwapLong" [ref=f13e610] [cursor=pointer]:
                  - /url: sql_mt5_symbols.htm
                - text: and
                - link "SwapShort" [ref=f13e611] [cursor=pointer]:
                  - /url: sql_mt5_symbols.htm
                - text: parameters.
        - row [ref=f13e612]:
