          - cell [ref=f13e885]:
            - paragraph [ref=f13e886]: "16"
          - cell [ref=f13e887]:
            - paragraph [ref=f13e888]: Stop Loss orders are allowed.
        - row [ref=f13e889]:
          - cell [ref=f13e890]:
            - paragraph [ref=f13e891]: ORDER_FLAGS_TP
          - cell [ref=f13e892]:
            - paragraph [ref=f13e893]: "32"
          - cell [ref=f13e894]:
            - paragraph [ref=f13e895]: Take Profit orders are allowed.
        - row [ref=f13e896]:
          - cell [ref=f13e897]:
            - paragraph [ref=f13e898]: ORDER_FLAGS_CLOSEBY
          - cell [ref=f13e899]:
            - paragraph [ref=f13e900]: "64"
          - cell [ref=f13e901]:
            - paragraph [ref=f13e902]:
              - generic [ref=f13e903]:
                - text: Orders to close a position by an opposite one (
                - link "OP_CLOSE_BY" [ref=f13e904] [cursor=pointer]:
                  - /url: https://support.metaquotes.net/en/docs/mt5/api/reference_trading/trading_order/imtorder/imtorder_enum#enordertype
                - text: ) are allowed. Close By permission of a symbol does not mean that this type of orders will be available on netting accounts. Close By orders can only be used on
                - link "hedging accounts" [ref=f13e905] [cursor=pointer]:
                  - /url: group_position.htm#hedging
                - text: .
