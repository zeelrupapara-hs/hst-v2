          - cell [ref=f13e373]:
            - paragraph [ref=f13e374]: TRADE_MODE_EXCH_OPTIONS_MARGIN
          - cell [ref=f13e375]:
            - paragraph [ref=f13e376]: "36"
          - cell [ref=f13e377]:
            - paragraph [ref=f13e378]: The Exchange Margin Options calculation mode.
        - row [ref=f13e379]:
          - cell [ref=f13e380]:
            - paragraph [ref=f13e381]: TRADE_MODE_EXCH_BONDS
