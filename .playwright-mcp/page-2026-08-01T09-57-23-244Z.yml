            - paragraph [ref=f13e404]: Description
      - rowgroup [ref=f13e405]:
        - row [ref=f13e406]:
          - cell [ref=f13e407]:
            - paragraph [ref=f13e408]: ORDERS_GTC
          - cell [ref=f13e409]:
            - paragraph [ref=f13e410]: "0"
          - cell [ref=f13e411]:
            - paragraph [ref=f13e412]: "\"Good till canceled\" mode. As a trade day changes, pending orders are preserved."
        - row [ref=f13e413]:
          - cell [ref=f13e414]:
            - paragraph [ref=f13e415]: ORDERS_DAILY
          - cell [ref=f13e416]:
            - paragraph [ref=f13e417]: "1"
          - cell [ref=f13e418]:
            - paragraph [ref=f13e419]: "\"Good till today including SL/TP\" mode. Orders are effective only within one trading day. As soon as it is over, all Stop Loss and Take Profit levels, as well all pending orders are deleted."
        - row [ref=f13e420]:
          - cell [ref=f13e421]:
            - paragraph [ref=f13e422]: ORDERS_DAILY_NO_STOPS
          - cell [ref=f13e423]:
            - paragraph [ref=f13e424]: "2"
          - cell [ref=f13e425]:
            - paragraph [ref=f13e426]: "\"Good till today excluding SL/TP\" mode. As a trading day changes, only pending orders are deleted, while Stop Loss and Take Profit levels are preserved."
    - paragraph [ref=f13e427]: EnTickFlags
    - paragraph [ref=f13e428]: Options of working with the symbol's tick data are enumerated in EnTickFlags.
    - table [ref=f13e430]:
      - rowgroup [ref=f13e431]:
        - row [ref=f13e432]:
          - columnheader [ref=f13e433]:
            - paragraph [ref=f13e434]: ID
          - columnheader [ref=f13e435]:
            - paragraph [ref=f13e436]: Value
          - columnheader [ref=f13e437]:
            - paragraph [ref=f13e438]: Description
      - rowgroup [ref=f13e439]:
        - row [ref=f13e440]:
          - cell [ref=f13e441]:
            - paragraph [ref=f13e442]: TICK_REALTIME
          - cell [ref=f13e443]:
            - paragraph [ref=f13e444]: "1"
          - cell [ref=f13e445]:
            - paragraph [ref=f13e446]: Allow real-time quotes from data feeds.
        - row [ref=f13e447]:
          - cell [ref=f13e448]:
            - paragraph [ref=f13e449]: TICK_COLLECTRAW
          - cell [ref=f13e450]:
            - paragraph [ref=f13e451]: "2"
          - cell [ref=f13e452]:
            - paragraph [ref=f13e453]: Enable keeping of raw prices.
        - row [ref=f13e454]:
          - cell [ref=f13e455]:
            - paragraph [ref=f13e456]: TICK_FEED_STATS
          - cell [ref=f13e457]:
            - paragraph [ref=f13e458]: "4"
          - cell [ref=f13e459]:
            - paragraph [ref=f13e460]: Receive market statistics (Ask High, Bid Low, etc.) directly from data feeds without calculation on the history server. If this flag is not set, the statistical information is calculated by the history server.
            - paragraph [ref=f13e461]: This flag can only be set together with TICK_REALTIME.
        - row [ref=f13e462]:
          - cell [ref=f13e463]:
            - paragraph [ref=f13e464]: TICK_NONE
          - cell [ref=f13e465]:
            - paragraph [ref=f13e466]: "0"
          - cell [ref=f13e467]:
            - paragraph [ref=f13e468]: Beginning of enumeration. Corresponds to the absence of rights.
    - paragraph [ref=f13e469]: EnMarginFlags
    - paragraph [ref=f13e470]: The additional margin checks are enumerated in EnMarginFlags.
    - table [ref=f13e472]:
      - rowgroup [ref=f13e473]:
        - row [ref=f13e474]:
          - columnheader [ref=f13e475]:
            - paragraph [ref=f13e476]: ID
          - columnheader [ref=f13e477]:
            - paragraph [ref=f13e478]: Value
          - columnheader [ref=f13e479]:
            - paragraph [ref=f13e480]: Description
      - rowgroup [ref=f13e481]:
        - row [ref=f13e482]:
          - cell [ref=f13e483]:
            - paragraph [ref=f13e484]: MARGIN_FLAGS_NONE
          - cell [ref=f13e485]:
            - paragraph [ref=f13e486]: "0"
          - cell [ref=f13e487]:
            - paragraph [ref=f13e488]: The standard mode of margin checking. The margin is checked when any order is placed and when a pending orders triggers.
        - row [ref=f13e489]:
          - cell [ref=f13e490]:
            - paragraph [ref=f13e491]: MARGIN_FLAGS_CHECK_PROCESS
          - cell [ref=f13e492]:
            - paragraph [ref=f13e493]: "1"
          - cell [ref=f13e494]:
            - paragraph [ref=f13e495]: "If this flags is enabled, another check of margin is added to those described above: the margin is checked before executing an order after it is confirmed (checked) by the server (at automated execution), by a dealer or by a gateway."
        - row [ref=f13e496]:
          - cell [ref=f13e497]:
            - paragraph [ref=f13e498]: MARGIN_FLAGS_CHECK_SLTP
          - cell [ref=f13e499]:
            - paragraph [ref=f13e500]: "2"
          - cell [ref=f13e501]:
            - paragraph [ref=f13e502]: This flag enables an additional check of margin before a position is closed by stop loss or take profit. If the position close results in reducing the margin to a level insufficient to maintain open positions and orders, the stop loss/take profit will not trigger, the position will stay open. This check must be enabled in case the trade operations are transmitted to an external system (exchange).
        - row [ref=f13e503]:
          - cell [ref=f13e504]:
            - paragraph [ref=f13e505]: MARGIN_FLAGS_HEDGE_LARGE_LEG
          - cell [ref=f13e506]:
            - paragraph [ref=f13e507]: "4"
          - cell [ref=f13e508]:
            - paragraph [ref=f13e509]: If the flag is enabled, the margin for hedged positions is calculated using larger leg (the total volume of users positions and orders opened in the same direction).
        - row [ref=f13e510]:
          - cell [ref=f13e511]:
            - paragraph [ref=f13e512]: MARGIN_FLAGS_EXCLUDE_PL
          - cell [ref=f13e513]:
            - paragraph [ref=f13e514]: "8"
          - cell [ref=f13e515]:
            - paragraph [ref=f13e516]: The flag affects the display of positions purchased with own funds, on accounts with margin trading enabled. If the flag is enabled, profit/loss of positions for the symbol will be ignored when calculating free margin, margin level and account equity. Also, Stop Out will not be applied to such positions.
        - row [ref=f13e517]:
          - cell [ref=f13e518]:
            - paragraph [ref=f13e519]: MARGIN_FLAGS_RECALC_RATES
          - cell [ref=f13e520]:
            - paragraph [ref=f13e521]: "10"
          - cell [ref=f13e522]:
            - paragraph [ref=f13e523]:
              - generic [ref=f13e524]:
                - text: If this flag is enabled, at the end of the trading day, the server will update the position
                - link "margin conversion rate" [ref=f13e525] [cursor=pointer]:
                  - /url: admin_positions.htm#margin_rate
                - text: at current market prices. For further details, please see the
                - link "Basic Margin Calculation" [ref=f13e526] [cursor=pointer]:
                  - /url: margin_formula.htm#recalculate_margin
                - text: section.
    - paragraph [ref=f13e527]: EnSwapMode
    - paragraph [ref=f13e528]:
      - generic [ref=f13e529]:
        - text: Types of swap calculation are enumerated in EnSwapMode. The swap size is specified using the
        - link "SwapLong" [ref=f13e530] [cursor=pointer]:
          - /url: sql_mt5_symbols.htm
        - text: and
        - link "SwapShort" [ref=f13e531] [cursor=pointer]:
          - /url: sql_mt5_symbols.htm
        - text: parameters.
