          - cell [ref=f13e805]:
            - paragraph [ref=f13e806]: TRADE_FLAGS_NONE
          - cell [ref=f13e807]:
            - paragraph [ref=f13e808]: "0"
          - cell [ref=f13e809]:
            - paragraph [ref=f13e810]: Beginning of enumeration. Corresponds to the absence of flags.
        - row [ref=f13e811]:
          - cell [ref=f13e812]:
            - paragraph [ref=f13e813]: TRADE_FLAGS_PROFIT_BY_MARKET
          - cell [ref=f13e814]:
            - paragraph [ref=f13e815]: "1"
          - cell [ref=f13e816]:
            - paragraph [ref=f13e817]:
              - text: This flag is used for the Forex type symbols only
              - generic [ref=f13e818]:
                - text: (
                - link "TRADE_MODE_FOREX" [ref=f13e819] [cursor=pointer]:
                  - /url: symbol_enum.htm#enexpirationflags
                - text: ).
            - paragraph [ref=f13e820]: By default for the conversion of profit/loss from the profit currency to the deposit currency, the price at which a deal (exit from position) is performed is used, the profitability/unprofitability of the deal is not taken into consideration.
            - paragraph [ref=f13e821]: If this flag is enabled, the conversion is performed using the current Bid/Ask price depending of the profitability/unprofitability of a deal. The Bid price is taken for calculations for profitable deals, because as a result of a profitable deal, a trader obtains a certain amount of the profit currency and needs to sell it for the deposit currency. The Ask price is taken for losing deals, because as a result of a losing deal, a trader needs to buy a certain amount of currency for the deposit currency.
        - row [ref=f13e822]:
          - cell [ref=f13e823]:
            - paragraph [ref=f13e824]: TRADE_FLAGS_ALLOW_SIGNALS
          - cell [ref=f13e825]:
            - paragraph [ref=f13e826]: "2"
          - cell [ref=f13e827]:
            - paragraph [ref=f13e828]:
              - generic [ref=f13e829]:
                - text: If this flag is not enabled, clients will not be able to copy trade operations by this symbol using the
                - link "Signals" [ref=f13e830] [cursor=pointer]:
                  - /url: https://www.mql5.com/en/signals
                - text: service. Trading signals can also be disabled on a client group level (
                - link "EnTradeFlags" [ref=f13e831] [cursor=pointer]:
                  - /url: group_enum.htm#entradeflags
                - text: ).
    - paragraph [ref=f13e832]: EnOrderFlags
    - paragraph [ref=f13e833]:
      - generic [ref=f13e834]:
        - text: Flags of
        - link "orders" [ref=f13e835] [cursor=pointer]:
          - /url: sql_mt5_orders.htm
        - text: that are allowed for the symbol are enumerated in EnOrderFlags.
