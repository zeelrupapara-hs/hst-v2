    - paragraph [ref=f13e393]: EnGTCMode
    - paragraph [ref=f13e394]: Types of order expiration are enumerated in EnGTCMode.
    - table [ref=f13e396]:
      - rowgroup [ref=f13e397]:
        - row [ref=f13e398]:
          - columnheader [ref=f13e399]:
            - paragraph [ref=f13e400]: ID
          - columnheader [ref=f13e401]:
            - paragraph [ref=f13e402]: Value
