          - cell [ref=f13e864]:
            - paragraph [ref=f13e865]: "2"
          - cell [ref=f13e866]:
            - paragraph [ref=f13e867]: Limit orders Buy Limit and Sell Limit are allowed.
        - row [ref=f13e868]:
          - cell [ref=f13e869]:
            - paragraph [ref=f13e870]: ORDER_FLAGS_STOP
          - cell [ref=f13e871]:
            - paragraph [ref=f13e872]: "4"
          - cell [ref=f13e873]:
            - paragraph [ref=f13e874]: Stop orders Buy Stop and Sell Stop are allowed.
        - row [ref=f13e875]:
          - cell [ref=f13e876]:
            - paragraph [ref=f13e877]: ORDER_FLAGS_STOP_LIMIT
          - cell [ref=f13e878]:
