          - cell [ref=f12e271]:
            - paragraph [ref=f12e272]: "1"
          - cell [ref=f12e273]:
            - paragraph [ref=f12e274]:
              - generic [ref=f12e275]:
                - text: Enables sending of generated HTML report files to clients by email. Addresses from
                - link "trading accounts" [ref=f12e276] [cursor=pointer]:
                  - /url: account_edit.htm#personal
                - text: are used for sending.
        - row [ref=f12e277]:
          - cell [ref=f12e278]:
            - paragraph [ref=f12e279]: REPORTSFLAGS_SUPPORT
          - cell [ref=f12e280]:
            - paragraph [ref=f12e281]: "2"
          - cell [ref=f12e282]:
            - paragraph [ref=f12e283]:
              - generic [ref=f12e284]:
                - text: Enables sending of report copies to a
                - link "technical support email address" [ref=f12e285] [cursor=pointer]:
                  - /url: groups_settings.htm#support_email
                - text: .
        - row [ref=f12e286]:
          - cell [ref=f12e287]:
            - paragraph [ref=f12e288]: REPORTSFLAGS_STATEMENTS
          - cell [ref=f12e289]:
            - paragraph [ref=f12e290]: "4"
          - cell [ref=f12e291]:
            - paragraph [ref=f12e292]:
              - generic [ref=f12e293]:
                - text: Enables account state report generation. The HTML report files are created using templates from the \templates\confirmation\ and \templates\statement\ folders on the trade server. The generate reports, the
                - link "REPORTS_STANDARD" [ref=f12e294] [cursor=pointer]:
                  - /url: group_enum.htm#enreportsmode
                - text: mode must be enabled.
