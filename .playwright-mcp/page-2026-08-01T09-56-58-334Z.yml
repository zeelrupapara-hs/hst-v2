            - paragraph [ref=f12e485]: The levels of Margin Call and Stop Out in money terms.
    - paragraph [ref=f12e486]: EnTradeFlags
    - paragraph [ref=f12e487]: Group trade options are enumerated in EnTradeFlags.
    - table [ref=f12e489]:
      - rowgroup [ref=f12e490]:
        - row [ref=f12e491]:
          - columnheader [ref=f12e492]:
            - paragraph [ref=f12e493]: ID
          - columnheader [ref=f12e494]:
            - paragraph [ref=f12e495]: Value
          - columnheader [ref=f12e496]:
            - paragraph [ref=f12e497]: Description
      - rowgroup [ref=f12e498]:
        - row [ref=f12e499]:
          - cell [ref=f12e500]:
            - paragraph [ref=f12e501]: TRADEFLAGS_NONE
          - cell [ref=f12e502]:
            - paragraph [ref=f12e503]: "0x00000000"
          - cell [ref=f12e504]:
            - paragraph [ref=f12e505]: Options are disabled.
        - row [ref=f12e506]:
          - cell [ref=f12e507]:
            - paragraph [ref=f12e508]: TRADEFLAGS_SWAPS
          - cell [ref=f12e509]:
            - paragraph [ref=f12e510]: "0x00000001"
          - cell [ref=f12e511]:
            - paragraph [ref=f12e512]: Allow charging of swaps.
        - row [ref=f12e513]:
          - cell [ref=f12e514]:
            - paragraph [ref=f12e515]: TRADEFLAGS_TRAILING
          - cell [ref=f12e516]:
            - paragraph [ref=f12e517]: "0x00000002"
          - cell [ref=f12e518]:
            - paragraph [ref=f12e519]: Enable trailing stop.
        - row [ref=f12e520]:
          - cell [ref=f12e521]:
            - paragraph [ref=f12e522]: TRADEFLAGS_EXPERTS
          - cell [ref=f12e523]:
            - paragraph [ref=f12e524]: "0x00000004"
          - cell [ref=f12e525]:
            - paragraph [ref=f12e526]: Enable trading using Expert Advisors.
        - row [ref=f12e527]:
          - cell [ref=f12e528]:
            - paragraph [ref=f12e529]: TRADEFLAGS_EXPIRATION
          - cell [ref=f12e530]:
            - paragraph [ref=f12e531]: "0x00000008"
          - cell [ref=f12e532]:
            - paragraph [ref=f12e533]: Enable order expiration.
        - row [ref=f12e534]:
          - cell [ref=f12e535]:
            - paragraph [ref=f12e536]: TRADEFLAGS_SIGNALS_ALL
          - cell [ref=f12e537]:
            - paragraph [ref=f12e538]: "0x00000010"
          - cell [ref=f12e539]:
            - paragraph [ref=f12e540]:
              - generic [ref=f12e541]:
                - text: Allow using the
                - link "\"Signals\"" [ref=f12e542] [cursor=pointer]:
                  - /url: https://www.mql5.com/en/signals
                - text: service in the client terminals.
        - row [ref=f12e543]:
          - cell [ref=f12e544]:
            - paragraph [ref=f12e545]: TRADEFLAGS_SIGNALS_OWN
          - cell [ref=f12e546]:
            - paragraph [ref=f12e547]: "0x00000020"
          - cell [ref=f12e548]:
            - paragraph [ref=f12e549]:
              - generic [ref=f12e550]:
                - text: Allow using the
                - link "signals" [ref=f12e551] [cursor=pointer]:
                  - /url: https://www.mql5.com/en/signals
                - text: from own servers only. If this flag is set, clients in this groups will be able to subscribe only to the signals created on the basis of accounts opened in your brokerage company. Signals created on the basis of other accounts will not be displayed in the client terminals.
        - row [ref=f12e552]:
          - cell [ref=f12e553]:
            - paragraph [ref=f12e554]: TRADEFLAGS_SO_COMPENSATION
          - cell [ref=f12e555]:
            - paragraph [ref=f12e556]: "0x00000040"
          - cell [ref=f12e557]:
            - paragraph [ref=f12e558]:
              - generic [ref=f12e559]:
                - text: Automatically execute on a client's account the special "so compensation" operation, which increases the balance and sets it to zero, if the balance has become negative after a position was closed by Stop Out. For more details please read the
                - link "corresponding section" [ref=f12e560] [cursor=pointer]:
                  - /url: groups_settings.htm#compensate
                - text: .
        - row [ref=f12e561]:
          - cell [ref=f12e562]:
            - paragraph [ref=f12e563]: TRADEFLAGS_SO_FULLY_HEDGED
          - cell [ref=f12e564]:
            - paragraph [ref=f12e565]: "0x00000080"
          - cell [ref=f12e566]:
            - paragraph [ref=f12e567]:
              - generic [ref=f12e568]:
                - text: If the flag is enabled, then Stop out will be performed on accounts having open positions, the zero margin (positions are covered) and negative equity. If the option is disabled, orders and positions will not be forcibly closed in above cases. The flag can be only used on
                - link "hedging accounts" [ref=f12e569] [cursor=pointer]:
                  - /url: group_position.htm#hedging
                - text: .
        - row [ref=f12e570]:
          - cell [ref=f12e571]:
            - paragraph [ref=f12e572]: TRADEFLAGS_FIFO_CLOSE
          - cell [ref=f12e573]:
            - paragraph [ref=f12e574]: "0x00000100"
          - cell [ref=f12e575]:
            - paragraph [ref=f12e576]: "The position closing mode by FIFO rule. If the flag is enabled, then positions for each instrument can only be closed only in the order in which they were opened: the oldest one should be closed first, then the next one, etc. The option is only valid for hedging accounts, in which traders can have multiple positions for the same financial instrument. There are three main methods to close a position; the flag behavior will be different for each of the methods:"
            - paragraph [ref=f12e577]:
              - generic [ref=f12e578]: •
              - text: "Closing from the client terminal: the trader closes the position manually, using a trading robot, based on the Signals service subscription, etc. In case of an attempt to close a position, which does not meet the FIFO rule, the trader will receive an appropriate error."
            - paragraph [ref=f12e579]:
              - generic [ref=f12e580]: •
              - text: "Closing upon Stop Loss or Take Profit activation: these orders are processed on the server side, so the position closure is not requested on the trader (terminal) side, but is initiated by the server. If Stop Loss or Take Profit triggers for a position, and this position does not comply with the FIFO rule (there is an older position fro the same symbol), the position will not be closed. An appropriate message will be printed to the log: \"position close prohibited by FIFO rule, position #100448219 buy 3.00 EURUSD 1.11544 sl: 1.11537 tp: 1.11549 take profit activation skipped\"."
            - paragraph [ref=f12e581]:
              - generic [ref=f12e582]: •
              - generic [ref=f12e583]:
                - text: "Closing upon Stop Out triggering: such operations are also processed on the server side. In a normal mode, in which FIFO-based closing is disabled, in case of"
                - link "Stop Out" [ref=f12e584] [cursor=pointer]:
                  - /url: groups_settings.htm#stopout_processing
                - text: positions are closed starting with the one having the largest loss. If this option option is enabled, the open time will be additionally checked for losing positions. The server determines losing positions for each symbol, finds the oldest position for each symbol, and then closes the one which has the greatest loss among the found positions.
        - row [ref=f12e585]:
          - cell [ref=f12e586]:
            - paragraph [ref=f12e587]: TRADEFLAGS_HEDGE_PROHIBIT
          - cell [ref=f12e588]:
            - paragraph [ref=f12e589]: "0x00000200"
          - cell [ref=f12e590]:
            - paragraph [ref=f12e591]:
              - generic [ref=f12e592]:
                - text: Prohibit opening of opposite positions and placing of opposite orders. If this option is enabled, accounts are not allowed to have oppositely directed positions and orders for the same financial instrument. For example, if the account has a Buy position, then the user cannot open a Sell position or place a pending sell order for the same symbol. If such an attempt is made, the user will receive an error. The option is only valid for groups with the
                - link "hedging" [ref=f12e593] [cursor=pointer]:
                  - /url: group_position.htm#hedging
                - text: position accounting mode.
        - row [ref=f12e594]:
          - cell [ref=f12e595]:
            - paragraph [ref=f12e596]: TRADEFLAGS_DEAL_COST
          - cell [ref=f12e597]:
            - paragraph [ref=f12e598]: "0x00000400"
          - cell [ref=f12e599]:
            - paragraph [ref=f12e600]:
              - generic [ref=f12e601]:
                - text: Calculate deal execution
                - link "costs" [ref=f12e602] [cursor=pointer]:
                  - /url: groups_settings.htm#deal_cost
                - text: and display them in client terminals. All NFA regulated brokers should enable this option.
        - row [ref=f12e603]:
          - cell [ref=f12e604]:
            - paragraph [ref=f12e605]: TRADEFLAGS_SO_COMPENSATION_CREDIT
          - cell [ref=f12e606]:
            - paragraph [ref=f12e607]: "0x00000800"
          - cell [ref=f12e608]:
            - paragraph [ref=f12e609]:
              - generic [ref=f12e610]:
                - text: Works as an addition to the TRADEFLAGS_SO_COMPENSATION flag. If enabled, the credit funds on the account will be set to zero after a negative balance compensation operation.
                - link "Credit funds" [ref=f12e611] [cursor=pointer]:
                  - /url: groups_settings.htm#so_credit
                - text: are withdrawn in a separate balance operation with the "so credit compensation" type.
    - paragraph [ref=f12e612]: EnMarginFreeProfitFlags
    - paragraph [ref=f12e613]: Modes of using of the profit/loss fixed during a trade day in the free margin are enumerated in EnMarginFreeProfitFlags.
    - table [ref=f12e615]:
      - rowgroup [ref=f12e616]:
        - row [ref=f12e617]:
          - columnheader [ref=f12e618]:
            - paragraph [ref=f12e619]: ID
          - columnheader [ref=f12e620]:
            - paragraph [ref=f12e621]: Value
          - columnheader [ref=f12e622]:
            - paragraph [ref=f12e623]: Description
      - rowgroup [ref=f12e624]:
        - row [ref=f12e625]:
          - cell [ref=f12e626]:
            - paragraph [ref=f12e627]: FREE_MARGIN_PROFIT_PL
          - cell [ref=f12e628]:
            - paragraph [ref=f12e629]: "0"
          - cell [ref=f12e630]:
            - paragraph [ref=f12e631]: Include both profit and loss fixed during a day in the free margin.
        - row [ref=f12e632]:
          - cell [ref=f12e633]:
            - paragraph [ref=f12e634]: FREE_MARGIN_PROFIT_LOSS
          - cell [ref=f12e635]:
            - paragraph [ref=f12e636]: "1"
          - cell [ref=f12e637]:
            - paragraph [ref=f12e638]:
              - generic [ref=f12e639]:
                - text: Include onlyInclude only loss fixed during a day in the free margin. The profits of the client during a trading day are accumulated in the
                - link "BlockedProfit" [ref=f12e640] [cursor=pointer]:
                  - /url: sql_mt5_accounts.htm
                - text: field of the trade account and are not included in the free margin. At the end of the trading day, the accumulated profits are credited to the balance and the value of IMTAccount::BlockedProfit is reset. fixed during a day in the free margin.
    - paragraph [ref=f12e641]: EnMarginMode
    - paragraph [ref=f12e642]: The models of risk management are enumerated in EnMarginMode. The model defines the type of pre-trade control and the position accounting system used.
    - table [ref=f12e644]:
      - rowgroup [ref=f12e645]:
        - row [ref=f12e646]:
          - columnheader [ref=f12e647]:
            - paragraph [ref=f12e648]: ID
          - columnheader [ref=f12e649]:
            - paragraph [ref=f12e650]: Value
          - columnheader [ref=f12e651]:
            - paragraph [ref=f12e652]: Description
      - rowgroup [ref=f12e653]:
        - row [ref=f12e654]:
          - cell [ref=f12e655]:
            - paragraph [ref=f12e656]: MARGIN_MODE_RETAIL
          - cell [ref=f12e657]:
            - paragraph [ref=f12e658]: "0"
          - cell [ref=f12e659]:
            - paragraph [ref=f12e660]: Used for the OTC market. Margin calculation is based on the type of instrument, as well as group settings. Netting position accounting system is used.
        - row [ref=f12e661]:
          - cell [ref=f12e662]:
            - paragraph [ref=f12e663]: MARGIN_MODE_EXCHANGE_DISCOUNT
          - cell [ref=f12e664]:
            - paragraph [ref=f12e665]: "1"
          - cell [ref=f12e666]:
            - paragraph [ref=f12e667]: Used for the exchange market. Margin calculation is based on the discounts specified in symbol settings. Discounts are set by the broker, however they cannot be lower than the exchange set values.
        - row [ref=f12e668]:
          - cell [ref=f12e669]:
            - paragraph [ref=f12e670]: MARGIN_MODE_RETAIL_HEDGED
          - cell [ref=f12e671]:
            - paragraph [ref=f12e672]: "2"
          - cell [ref=f12e673]:
            - paragraph [ref=f12e674]: Used for the OTC market. Margin calculation is based on the type of instrument, as well as group settings. Hedging position accounting system is used.
    - paragraph [ref=f12e675]: EnMarginFlags
    - paragraph [ref=f12e676]: EnMarginFlags contains the margin calculation flags.
    - table [ref=f12e678]:
      - rowgroup [ref=f12e679]:
        - row [ref=f12e680]:
          - columnheader [ref=f12e681]:
            - paragraph [ref=f12e682]: ID
          - columnheader [ref=f12e683]:
            - paragraph [ref=f12e684]: Value
          - columnheader [ref=f12e685]:
            - paragraph [ref=f12e686]: Description
      - rowgroup [ref=f12e687]:
        - row [ref=f12e688]:
          - cell [ref=f12e689]:
            - paragraph [ref=f12e690]: MARGIN_FLAGS_NONE
          - cell [ref=f12e691]:
            - paragraph [ref=f12e692]: "0"
          - cell [ref=f12e693]:
            - paragraph [ref=f12e694]: No flags.
        - row [ref=f12e695]:
          - cell [ref=f12e696]:
            - paragraph [ref=f12e697]: MARGIN_FLAGS_CLEAR_ACC
          - cell [ref=f12e698]:
            - paragraph [ref=f12e699]: "1"
          - cell [ref=f12e700]:
            - paragraph [ref=f12e701]:
              - generic [ref=f12e702]:
                - text: The flag is available only in the
                - link "FREE_MARGIN_PROFIT_LOSS" [ref=f12e703] [cursor=pointer]:
                  - /url: group_enum.htm#enmarginfreeprofitflags
                - text: mode. If enabled, the profit accumulated by a client will be released (and thus included in the free margin) at the end of trade day. If this flag is disabled, then it will be possible to release the accumulated profit only using an external application (for example, a gateway). The server will not perform this operation.
    - paragraph [ref=f12e704]