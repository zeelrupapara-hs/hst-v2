          - cell [ref=f12e220]:
            - paragraph [ref=f12e221]: REPORTS_DISABLED
          - cell [ref=f12e222]:
            - paragraph [ref=f12e223]: "0"
          - cell [ref=f12e224]:
            - paragraph [ref=f12e225]: Reports are disabled.
        - row [ref=f12e226]:
          - cell [ref=f12e227]:
            - paragraph [ref=f12e228]: REPORTS_FULL
          - cell [ref=f12e229]:
            - paragraph [ref=f12e230]: "1"
          - cell [ref=f12e231]:
            - paragraph [ref=f12e232]: The platform can save the end-of-day and/or end-of-month states of accounts to a special database. The information includes balance, equity, margin, and other details. The database is located on the trade server, in the bases\daily\daily_*.dat file. Data from the file is used in end-of-day and end-of-month trading reports sent to clients, as well as in some manager reports. If the mode is enabled, the platform will save information on accounts from the selected group to the database.
            - paragraph [ref=f12e233]: This flag enables the generation of both end-of-day and end-of-month data.
        - row [ref=f12e234]:
          - cell [ref=f12e235]:
            - paragraph [ref=f12e236]: REPORTS_DAY_ONLY
          - cell [ref=f12e237]:
            - paragraph [ref=f12e238]: "2"
          - cell [ref=f12e239]:
            - paragraph [ref=f12e240]: Enable data generation for reports only at the end of the day.
        - row [ref=f12e241]:
          - cell [ref=f12e242]:
            - paragraph [ref=f12e243]: REPORTS_MONTH_ONLY
          - cell [ref=f12e244]:
            - paragraph [ref=f12e245]: "3"
          - cell [ref=f12e246]:
            - paragraph [ref=f12e247]: Enable data generation for reports only at the end of the month.
    - paragraph [ref=f12e248]: EnReportsFlags
