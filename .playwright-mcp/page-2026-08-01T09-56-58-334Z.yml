    - paragraph [ref=f12e78]: EnPermissionsFlags
    - paragraph [ref=f12e79]: Flags of permissions for groups are listed in EnPermissionsFlags.
    - table [ref=f12e81]:
      - rowgroup [ref=f12e82]:
        - row [ref=f12e83]:
          - columnheader [ref=f12e84]:
            - paragraph [ref=f12e85]: ID
          - columnheader [ref=f12e86]:
            - paragraph [ref=f12e87]: Value
          - columnheader [ref=f12e88]:
            - paragraph [ref=f12e89]: Description
      - rowgroup [ref=f12e90]:
        - row [ref=f12e91]:
          - cell [ref=f12e92]:
            - paragraph [ref=f12e93]: PERMISSION_NONE
          - cell [ref=f12e94]:
            - paragraph [ref=f12e95]: "0x00000000"
          - cell [ref=f12e96]:
            - paragraph [ref=f12e97]: No permissions. Default value.
        - row [ref=f12e98]:
          - cell [ref=f12e99]:
            - paragraph [ref=f12e100]: PERMISSION_CERT_CONFIRM
          - cell [ref=f12e101]:
            - paragraph [ref=f12e102]: "0x00000001"
          - cell [ref=f12e103]:
            - paragraph [ref=f12e104]: Enable confirmation of certificates.
        - row [ref=f12e105]:
          - cell [ref=f12e106]:
            - paragraph [ref=f12e107]: PERMISSION_ENABLE_CONNECTION
          - cell [ref=f12e108]:
            - paragraph [ref=f12e109]: "0x00000002"
          - cell [ref=f12e110]:
            - paragraph [ref=f12e111]: Allow client connections.
        - row [ref=f12e112]:
          - cell [ref=f12e113]:
            - paragraph [ref=f12e114]: PERMISSION_RESET_PASSWORD
          - cell [ref=f12e115]:
            - paragraph [ref=f12e116]: "0x00000004"
          - cell [ref=f12e117]:
            - paragraph [ref=f12e118]: Force users to change their master password at first login. A user will not be able to take any actions before changing the password.
        - row [ref=f12e119]:
          - cell [ref=f12e120]:
            - paragraph [ref=f12e121]: PERMISSION_FORCED_OTP_USAGE
          - cell [ref=f12e122]:
            - paragraph [ref=f12e123]: "0x00000008"
          - cell [ref=f12e124]:
            - paragraph [ref=f12e125]: In some countries, regulators require use of additional account security measures, such as the use of OTP. When this flag is enabled, all clients in this group will need to use one-time passwords to connect. Otherwise, clients can bind their accounts to the generator or use the default authentication method. Before you enable it, please inform your clients about the new OTP option. Be extremely careful when enabling this option for the only one manager group on the trading server.
            - paragraph [ref=f12e126]: For generating one-time passwords, the mobile terminal MetaTrader 5 for iPhone is used for generating one-time passwords.
        - row [ref=f12e127]:
          - cell [ref=f12e128]:
            - paragraph [ref=f12e129]: PERMISSION_RISK_WARNING
          - cell [ref=f12e130]:
            - paragraph [ref=f12e131]: "0x00000010"
          - cell [ref=f12e132]:
            - paragraph [ref=f12e133]: If this flag is enabled, when a client connects in the trading terminal, a warning about the risks associated with operations on the financial markets appears. Trade operations on a client's account are not allowed until the client confirms that he or she has read the warning and is aware of the risks. To confirm, the client should check "I am aware of the risks and I wish to trade high risk investment products". This warning is displayed once per session of the terminal. The next time it will appear after the restart of the terminal.
        - row [ref=f12e134]:
          - cell [ref=f12e135]:
            - paragraph [ref=f12e136]: PERMISSION_REGULATION_PROTECT
          - cell [ref=f12e137]:
            - paragraph [ref=f12e138]: "0x00000020"
          - cell [ref=f12e139]:
            - paragraph [ref=f12e140]: Enforce country-specific regulatory restrictions for retail clients.
            - paragraph [ref=f12e141]
            - paragraph [ref=f12e142]: Every country has regulators — state bodies that supervise the activities of financial institutions (including brokers). Each regulator has its own set of requirements applied to trading currencies, securities and other instruments.
            - paragraph [ref=f12e143]
            - paragraph [ref=f12e144]: In most cases, clients of brokerage firms are individuals from different countries. The platform provides the means of meeting the requirements of certain regulators without interfering with the work of traders not covered with these requirements. Restrictions applied to trader accounts depend on the client's country and other conditions set by that country's regulator.
            - paragraph [ref=f12e145]
            - paragraph [ref=f12e146]: For example, the National Securities Market Commission (Comisión Nacional del Mercado de Valores) of Spain compels brokers to warn clients using the leverage of 1:10 or higher about potential risks in a special way. Therefore, if a client's country is Spain and they use a leverage of 1:10 or higher, an additional warning is displayed in the trading dialog
            - paragraph [ref=f12e147]
            - paragraph [ref=f12e148]: Currently, only one regional limitation is used in the platform. The list is to be expanded later.
        - row [ref=f12e149]:
          - cell [ref=f12e150]:
            - paragraph [ref=f12e151]: PERMISSION_NOTIFY_DEALS
          - cell [ref=f12e152]:
            - paragraph [ref=f12e153]: "0x00000040"
          - cell [ref=f12e154]:
            - paragraph [ref=f12e155]:
              - generic [ref=f12e156]:
                - text: Allow accounts to subscribe to
                - link "server push notifications" [ref=f12e157] [cursor=pointer]:
                  - /url: groups_settings.htm#push
                - text: about deals.
        - row [ref=f12e158]:
          - cell [ref=f12e159]:
            - paragraph [ref=f12e160]: PERMISSION_NOTIFY_ORDERS
          - cell [ref=f12e161]:
            - paragraph [ref=f12e162]: "0x00000080"
          - cell [ref=f12e163]:
            - paragraph [ref=f12e164]: Allow accounts to subscribe to server push notifications about orders.
        - row [ref=f12e165]:
          - cell [ref=f12e166]:
            - paragraph [ref=f12e167]: PERMISSION_NOTIFY_BALANCES
          - cell [ref=f12e168]:
            - paragraph [ref=f12e169]: "0x00000100"
          - cell [ref=f12e170]:
            - paragraph [ref=f12e171]: Allow accounts to subscribe to server push notifications about balance operations.
