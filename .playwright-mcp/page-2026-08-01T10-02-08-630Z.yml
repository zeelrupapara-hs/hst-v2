          - 'cell "If several individual configurations are created for the same symbol (for example, there is a configuration for all symbols by mask \"*\", and a configuration for a specific symbol), then every configuration will be applied sequentially from the top downwards. And if a parameter in the configurations is set to \"Default\", it means that it won''t be changed. For example: • A symbol has minimal and maximal volume set to 0.01 lot and 100 lots on default. • A configuration is added for the group where the minimal and maximal volume is overridden to 0.1 lot and 150 lots respectively. • Another configuration is added with settings \"Use default volumes\" and Spread difference = 5. The last configuration will not reset the minimal and maximal volume to default 0.01 lots and 100 lots respectively. Values 0.1 and 150 will be used." [ref=f14e38]':
