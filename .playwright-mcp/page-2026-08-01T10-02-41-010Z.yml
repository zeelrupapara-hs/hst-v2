  - generic [ref=f17e30]:
    - paragraph [ref=f17e31]: Execution
    - paragraph [ref=f17e32]:
      - img "Execution" [ref=f17e33]
    - paragraph [ref=f17e34]: "The symbol order execution mode is set up on this tab:"
    - paragraph [ref=f17e35]: Instant
    - paragraph [ref=f17e36]: "In this mode a client places an order at prices from the Market Watch window without requesting prices before that. The following settings are available for this mode:"
    - paragraph [ref=f17e37]:
      - generic [ref=f17e38]: •
      - text: Max time deviation — the maximal difference (in seconds) between the time when the price specified in the client's order was received, and the time of the latest price. If this limit is exceeded, requote is performed and new prices are sent to the client;
    - paragraph [ref=f17e39]:
      - generic [ref=f17e40]: •
      - text: Max profit deviation — maximal deviation of the order price from the current symbol price in the direction profitable for a client. This value being exceeded, new prices will be sent to the client;
    - paragraph [ref=f17e41]:
      - generic [ref=f17e42]: •
      - text: Max losing deviation — maximal deviation of the order price from the current symbol price in the direction losing for a client. This value being exceeded, new prices will be sent to the client;
    - paragraph [ref=f17e43]:
      - generic [ref=f17e44]: •
      - text: Maximum volume — the maximum volume of the order that can be accepted in the instant execution mode. All clients' orders larger than that will be automatically switched to the request execution mode.
    - paragraph [ref=f17e45]:
      - generic [ref=f17e46]: •
      - text: Fast confirmation of requotes within client deviation — the option is disabled by default. When creating a trade request in the instant execution mode, the client can specify tolerance, i.e. by how many points the request execution price can differ from the price specified in the order. If a dealer returns a requote in response to such a request, and the requote price is within the tolerable deviation specified by the client, the order will be returned to the dealer for confirmation after the client confirms this new price. If the option is enabled, the order will be executed immediately after the client confirms the price. No additional confirmation from a dealer is required.
    - paragraph [ref=f17e47]: The following options are used only if the deal volume exceeds the maximum volume that can be accepted in the instant execution mode. Such deals are processed in the "Request" execution mode.
    - paragraph [ref=f17e48]:
      - generic [ref=f17e49]: •
      - text: Timeout — time in seconds, during which the price provided by the dealer is valid;
    - paragraph [ref=f17e50]:
      - generic [ref=f17e51]: •
      - text: Confirm orders — if this option is enabled, then after a trader receives quotes from a dealer and agrees to execute a deal at them, the dealer will have to additionally confirm the execution of this order.
    - paragraph [ref=f17e52]: Checking prices and requotes
    - paragraph [ref=f17e53]:
      - generic [ref=f17e54]:
        - text: If the price in the trade request exceeds the maximum deviation in the profit or loss direction, the server returns a requote to the client and prints the following message to the
        - link "Journal" [ref=f17e55] [cursor=pointer]:
          - /url: network_journal.htm
        - text: ":"
    - table [ref=f17e57]:
      - rowgroup [ref=f17e58]:
