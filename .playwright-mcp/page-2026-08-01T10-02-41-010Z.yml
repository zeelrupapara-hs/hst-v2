    - paragraph [ref=f17e62]: "If the requot price provided by the dealer exceeds the maximum deviation specified by the trader in the trade request (order), another requote is sent to the trader. the following message is printed to the journal:"
    - table [ref=f17e64]:
      - rowgroup [ref=f17e65]:
        - row [ref=f17e66]:
          - cell [ref=f17e67]:
            - paragraph [ref=f17e68]: "'7000009': requote 1.15313 / 1.15333 (instant buy 0.01 EURUSD at 1.15331)[dealer deviation]"
    - paragraph [ref=f17e69]: Apart from checking the price value and time deviation according to symbol settings, the server performs additional checks.
    - paragraph [ref=f17e70]: Checking for presence in the flow. The price used by a client to set an order, should be present in the quote flow. In other words, a deal cannot be performed at a non-existing price. The price search depth is defined by the "Max time deviation" parameter. If there is no price, the server sends a requote to a client and the appropriate message (deviation is blocked with 'count' on 'request') appears in the journal. Here 'count' means the counter of invalid client requests, while 'request' is a request description. In each case of that type, the invalid client request counter is increased.
    - paragraph [ref=f17e71]: "Checking for obsolescence. The platform checks if the prices used by a client to place an order are obsolete. Depending on the market rate, the server calculates the range of the last ticks, within which the requested price is located. On the fast market, the acceptable range is expanded, while on the slow market, it is narrowed. If the price does not fall within the acceptable range, the server sends the client a requote and leaves the following message in the journal: previous price 'x' on 'request.' Here, 'x' is a location of the requested price in the quote flow (0 means the last price), while 'request' is a request description. In each case of that type, the invalid client request counter is increased."
    - paragraph [ref=f17e72]: Invalid request counter. The server features the invalid request counter for each client. As soon as the counter exceeds the threshold value, the server starts rejecting subsequent invalid client requests leaving the 'off quotes' message. The appropriate message (deviation is blocked with 'count' on 'request') appears in the journal. Here, 'count' means the counter of invalid client requests, while 'request' is the last request description. When a valid client request is received, the counter is decreased.
    - paragraph [ref=f17e73]: Request
    - paragraph [ref=f17e74]: "In this mode, a client requests the filling price before placing an order. The following options are available here:"
    - paragraph [ref=f17e75]:
      - generic [ref=f17e76]: •
      - text: Timeout — time in seconds, during which the price provided by the dealer is valid;
    - paragraph [ref=f17e77]:
      - generic [ref=f17e78]: •
      - text: Confirm orders — if this option is enabled, then after a trader receives quotes from a dealer and agrees to execute a deal at them, the dealer will have to additionally confirm the execution of this order.
    - paragraph [ref=f17e79]: Market
    - paragraph [ref=f17e80]: In this mode, a client places an order at the broker's price, "agreeing with it in advance".
    - paragraph [ref=f17e81]: Exchange
