paths:
  /api/v1/auth/logout:
    post:
      operationId: Logout
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/internal_server_v1.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server_v1.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server_v1.Response'
      security:
      - BearerAuth: []
      tags:
      - Auth
  /api/v1/auth/me:
    get:
